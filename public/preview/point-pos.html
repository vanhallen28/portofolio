:root {
  --font-lora: 'Lora';
  --font-outfit: 'Outfit';
  --serif: var(--font-lora), Georgia, 'Times New Roman', serif;
  --sans: var(--font-outfit), system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, Menlo, monospace;

  --bg: #f1ebe1;
  --surface: #fbf8f2;
  --ink: #2b2620;
  --blue: #2f6bff;
  --blue-tint: #eaf0ff;
  --muted: #8d8574;
  --faint: #a79d8a;
  --faint2: #b4aa95;
  --disc-faint: #c9bfa9;
  --track: #e9e1d2;
  --divider: #f1ebe1;

  --ok-fg: #2e7d4f;
  --ok-bg: #e7f1e8;
  --warn-fg: #9a6b15;
  --warn-bg: #f5ecd7;
  --danger-fg: #c2452d;
  --danger-bg: #f7e2db;
  --alert-dot: #d96a4b;

  --sh-card: 0 1px 3px rgba(43, 38, 32, 0.05);
  --sh-order: 0 2px 12px rgba(43, 38, 32, 0.07);
  --sh-catbar: 0 2px 10px rgba(43, 38, 32, 0.08);
  --sh-modal: 0 24px 60px rgba(43, 38, 32, 0.3);
  --sh-cta: 0 6px 16px rgba(47, 107, 255, 0.28);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
::placeholder { color: var(--faint2); }
input, select { font-family: var(--sans); }
input:focus, select:focus { outline: 2px solid #2f6bff33; outline-offset: 0; }
a { color: var(--blue); text-decoration: none; }
a:hover { color: #1a4fd6; }

.app { height: 100vh; min-height: 640px; padding: 16px; display: flex; gap: 16px; background: var(--bg); position: relative; overflow: hidden; }
.mod { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.rail { width: 64px; flex: none; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-card); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 8px; }
.rail__ico { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; color: var(--faint); transition: background .15s; }
.rail__ico--active { background: var(--ink); color: var(--surface); }
.rail__gear { margin-top: auto; }
.rail__avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font: 600 12px var(--sans); color: var(--muted); flex: none; }

.topbar { flex: none; display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 18px; padding: 12px 20px; box-shadow: var(--sh-card); }
.topbar__title { font: 600 19px var(--serif); }
.spacer { flex: 1; }
.divider-v { width: 1px; height: 20px; background: #e3dbcc; }
.shift { font: 500 13px var(--sans); color: var(--muted); }
.clock { font: 400 12.5px var(--sans); color: var(--faint); }
.search { background: var(--bg); border: none; border-radius: 999px; padding: 10px 18px; color: var(--ink); font: 400 12.5px var(--sans); width: 210px; max-width: 44vw; }

.kasir { flex: 1; display: flex; gap: 16px; min-width: 0; }

.vscroll { flex: 1; overflow-y: auto; min-height: 0; }

.prodcard__top { display: flex; justify-content: space-between; align-items: center; }
.disc { width: 42px; height: 42px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font: 600 12.5px var(--sans); color: #fff; }
.disc--photo { object-fit: cover; overflow: hidden; padding: 0; }
.stockbadge { font: 500 11px var(--sans); color: var(--faint2); background: var(--bg); border-radius: 99px; padding: 3px 9px; }
.stockbadge--low { color: var(--danger-fg); }
.prodcard__name { margin-top: auto; font: 500 16px var(--serif); }
.prodcard__price { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; }

.sku { font: 400 9.5px var(--mono); color: var(--disc-faint); }
.catbar { flex: none; align-self: center; display: flex; gap: 5px; background: var(--surface); border-radius: 999px; padding: 6px; box-shadow: var(--sh-catbar); max-width: 100%; overflow-x: auto; }
.chip { padding: 9px 20px; border-radius: 999px; font: 500 12.5px var(--sans); cursor: pointer; user-select: none; white-space: nowrap; color: var(--muted); }
.chip--active { background: var(--ink); color: var(--surface); }

.order { width: 326px; flex: none; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-order); display: flex; flex-direction: column; overflow: hidden; }
.order__head { padding: 16px 20px 10px; }
.order__headrow { display: flex; justify-content: space-between; align-items: baseline; }
.order__title { font: 600 18px var(--serif); }
.typebtn { font: 500 11.5px var(--sans); color: var(--blue); background: var(--blue-tint); border-radius: 99px; padding: 4px 12px; cursor: pointer; user-select: none; }
.order__meta { font: 400 12px var(--sans); color: var(--faint); }
.order__items { flex: 1; padding: 4px 20px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
.order__empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--disc-faint); font: 400 13px var(--sans); text-align: center; padding: 20px; min-height: 120px; }
.cup { width: 52px; height: 52px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.line { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 15px; padding: 10px 13px; }
.line__info { flex: 1; min-width: 0; }
.line__name { font: 500 13px var(--sans); }
.line__sub { font: 400 11px var(--sans); color: var(--faint); }
.line__note { font: italic 400 10.5px var(--sans); color: var(--faint); }
.stepper { display: flex; align-items: center; gap: 8px; }
.step { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: transform .1s; }

.step--minus { background: var(--surface); color: var(--muted); }
.step--plus { background: var(--ink); color: var(--surface); }
.qty { font: 600 12.5px var(--sans); min-width: 14px; text-align: center; }
.order__foot { padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 6px; }
.sumrow { display: flex; justify-content: space-between; font: 400 12.5px var(--sans); color: var(--muted); }
.totalrow { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 8px; }
.totalrow__label { font: 500 14px var(--sans); }
.totalrow__val { font: 600 23px var(--serif); }
.paygrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.paybtn { border-radius: 12px; padding: 10px 0; text-align: center; font: 500 12px var(--sans); cursor: pointer; user-select: none; background: var(--bg); color: var(--muted); }
.paybtn--active { background: var(--ink); color: var(--surface); }
.cta { margin-top: 6px; border-radius: 999px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font: 600 13.5px var(--sans); user-select: none; transition: transform .1s; }
.cta:active { transform: scale(.99); }
.cta--on { background: var(--blue); color: #fff; cursor: pointer; box-shadow: var(--sh-cta); }
.cta--off { background: var(--track); color: var(--faint2); }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border-radius: 18px; padding: 15px 18px; box-shadow: var(--sh-card); }
.stat__label { font: 500 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--faint2); }
.stat__value { font: 600 22px var(--serif); margin-top: 4px; }
.stat__sub { font: 500 11.5px var(--sans); color: var(--faint); }
.stat__sub--up { color: var(--blue); }
.stat__link { font: 500 11.5px var(--sans); color: var(--blue); cursor: pointer; }
.chart { flex: 1; background: var(--surface); border-radius: 18px; padding: 16px 20px; display: flex; flex-direction: column; box-shadow: var(--sh-card); min-height: 0; }
.chart__head { display: flex; justify-content: space-between; font: 400 12px var(--sans); color: var(--faint); }
.chart__bars { flex: 1; display: flex; align-items: flex-end; gap: 8px; margin-top: 12px; min-height: 0; }
.bar { flex: 1; background: var(--track); border-radius: 99px; min-height: 4px; }
.bar--peak { background: var(--blue); }
.chart__axis { display: flex; justify-content: space-between; font: 400 10.5px var(--sans); color: #cfc6b3; margin-top: 8px; }
.dash-bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; height: 190px; flex: none; }
.panel { background: var(--surface); border-radius: 18px; padding: 14px 18px; box-shadow: var(--sh-card); display: flex; flex-direction: column; overflow: hidden; }
.panel__title { font: 500 13px var(--sans); margin-bottom: 8px; }
.panel__list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.listrow { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--divider); font: 400 12.5px var(--sans); }
.mono { font: 400 11px var(--mono); color: var(--faint2); }
.method-chip { font: 500 11px var(--sans); color: var(--muted); background: var(--bg); border-radius: 99px; padding: 2px 9px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--alert-dot); flex: none; }

.tablecard { flex: 1; background: var(--surface); border-radius: 20px; box-shadow: var(--sh-card); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.tablescroll { flex: 1; overflow: auto; min-height: 0; }
.tableinner { min-width: 100%; }
.thead, .trow { display: grid; gap: 10px; align-items: center; }
.thead { padding: 13px 22px; font: 500 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint2); border-bottom: 1px solid var(--divider); }
.trow { padding: 12px 22px; font: 400 13px var(--sans); border-bottom: 1px solid var(--divider); }
.trow--click { cursor: pointer; }
.trow--click:hover { background: var(--bg); }
.tfoot { flex: none; padding: 11px 22px; font: 400 11.5px var(--sans); color: var(--faint); border-top: 1px solid var(--divider); }
.stepbtn { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; user-select: none; flex: none; }
.tabs { display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; }
.tab { padding: 8px 18px; border-radius: 999px; font: 500 12px var(--sans); cursor: pointer; user-select: none; color: var(--muted); white-space: nowrap; }
.tab--active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(43, 38, 32, 0.08); }
.badge { font: 500 11px var(--sans); border-radius: 99px; padding: 4px 11px; }
.badge--ok { color: var(--ok-fg); background: var(--ok-bg); }
.badge--warn { color: var(--warn-fg); background: var(--warn-bg); }
.badge--danger { color: var(--danger-fg); background: var(--danger-bg); }
.arch-tag { font-style: normal; font-size: 10px; color: var(--faint); background: var(--bg); border-radius: 99px; padding: 1px 7px; margin-left: 6px; }
.cost-input { width: 82px; background: var(--bg); border: none; border-radius: 8px; padding: 6px 8px; text-align: right; font: 400 12.5px var(--sans); color: var(--ink); }

.kds-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.kds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; align-content: start; }
.kdscard { background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--sh-card); }
.kdscard__head { display: flex; align-items: baseline; gap: 10px; }
.kds__id { font: 600 17px var(--serif); }
.kds__time { font: 400 11.5px var(--sans); color: var(--faint); }
.typechip { font: 500 11px var(--sans); color: var(--muted); background: var(--bg); border-radius: 99px; padding: 3px 11px; align-self: flex-start; }
.kds__items { display: flex; flex-direction: column; gap: 7px; border-top: 1px dashed var(--track); padding-top: 11px; }
.kdsitem { display: flex; gap: 9px; font: 400 13.5px var(--sans); }
.kdsqty { font: 600 13.5px var(--sans); color: var(--blue); min-width: 24px; }
.kdsopt { font-style: normal; color: var(--muted); }
.kdsnote { font-style: italic; color: var(--faint); }
.kds__act { border-radius: 999px; padding: 10px 0; text-align: center; font: 500 12px var(--sans); cursor: pointer; user-select: none; transition: transform .1s; }
.kds__act:active { transform: scale(.98); }

.op-start { display: flex; gap: 14px; flex: 1; min-height: 0; }
.op-card { width: 380px; flex: none; background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--sh-card); display: flex; flex-direction: column; gap: 14px; align-self: flex-start; }
.op-card__title { font: 600 17px var(--serif); }
.op-note { font: 400 12.5px var(--sans); color: var(--muted); line-height: 1.5; }
.op-note--faint { font: 400 11.5px var(--sans); color: var(--faint); line-height: 1.5; }
.toggle-row { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 15px; padding: 12px 15px; cursor: pointer; user-select: none; }
.toggle { width: 38px; height: 22px; border-radius: 99px; flex: none; position: relative; transition: background .2s; background: #d9cfbb; }
.toggle--on { background: var(--blue); }
.toggle__knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle--on .toggle__knob { left: 19px; }
.op-hist { flex: 1; background: var(--surface); border-radius: 20px; padding: 20px 24px; box-shadow: var(--sh-card); display: flex; flex-direction: column; min-width: 0; }
.op-progress { flex: none; display: flex; align-items: center; gap: 14px; padding: 0 6px; }
.progress { flex: 1; height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; display: block; }
.progress__fill { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.fisik { width: 76px; background: var(--bg); border: none; border-radius: 10px; padding: 8px 10px; text-align: center; font: 600 13px var(--sans); color: var(--ink); }
.op-actions { flex: none; display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--divider); }

.btn { border-radius: 999px; text-align: center; cursor: pointer; user-select: none; transition: transform .1s; }
.btn:active { transform: scale(.99); }
.btn--dark { background: var(--ink); color: var(--surface); }
.btn--blue { background: var(--blue); color: #fff; box-shadow: var(--sh-cta); }
.btn--ghost { background: var(--bg); color: var(--muted); }
.btn--disabled { background: var(--track); color: var(--faint2); cursor: default; }
.btn--disabled:active { transform: none; }
.pill-add { background: var(--ink); color: var(--surface); border-radius: 999px; padding: 10px 20px; font: 500 12.5px var(--sans); cursor: pointer; user-select: none; }

.overlay { position: fixed; inset: 0; background: rgba(43, 38, 32, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(3px); padding: 16px; }
.modal { background: var(--surface); border-radius: 24px; padding: 26px; box-shadow: var(--sh-modal); display: flex; flex-direction: column; gap: 14px; width: 400px; max-width: 100%; max-height: calc(100dvh - 32px); overflow-y: auto; }
.modal--wide { width: 460px; }
.modal__head { display: flex; justify-content: space-between; align-items: baseline; }
.modal__title { font: 600 19px var(--serif); }
.close { color: var(--faint); cursor: pointer; font-size: 17px; padding: 2px 6px; }
.field { display: flex; flex-direction: column; gap: 6px; font: 500 11.5px var(--sans); color: var(--muted); }
.field input, .field select { background: var(--bg); border: none; border-radius: 12px; padding: 11px 14px; font: 400 13.5px var(--sans); color: var(--ink); }
.field select { appearance: none; }
.btn-row { display: flex; gap: 9px; }
.sku-auto { display: flex; align-items: center; gap: 10px; background: var(--blue-tint); border-radius: 12px; padding: 11px 14px; font: 400 12px var(--sans); color: #5c6b8f; }
.sku-code { margin-left: auto; font: 600 12px var(--mono); color: var(--blue); }
.pay-total { text-align: center; padding: 6px 0 2px; }
.pay-total__label { font: 400 12px var(--sans); color: var(--faint); }
.pay-total__value { font: 600 30px var(--serif); }
.quickgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.quick { border-radius: 11px; padding: 10px 0; text-align: center; font: 500 12px var(--sans); cursor: pointer; user-select: none; background: var(--bg); color: #5c554a; }
.quick--active { background: var(--ink); color: var(--surface); }
.cash-row { display: flex; justify-content: space-between; font: 400 13px var(--sans); color: var(--muted); background: var(--bg); border-radius: 13px; padding: 12px 16px; }
.qr { align-self: center; width: 150px; height: 150px; border: 2px dashed #d9cfbb; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-align: center; font: 400 11.5px var(--sans); color: var(--faint); padding: 12px; }
.edc { background: var(--bg); border-radius: 13px; padding: 14px 16px; font: 400 12.5px var(--sans); color: var(--muted); text-align: center; line-height: 1.5; }
.success-check { align-self: center; width: 52px; height: 52px; border-radius: 50%; background: var(--ok-bg); color: var(--ok-fg); display: flex; align-items: center; justify-content: center; font-size: 24px; }
.receipt { background: var(--bg); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 7px; }
.receipt__row { display: flex; justify-content: space-between; font: 400 12.5px var(--sans); color: #5c554a; }
.receipt__divider { border-top: 1px dashed #d9cfbb; margin: 4px 0; }
.receipt__total { display: flex; justify-content: space-between; font: 600 15px var(--sans); }
.ba-list { background: var(--bg); border-radius: 16px; padding: 6px 18px; display: flex; flex-direction: column; max-height: 240px; overflow-y: auto; }
.ba-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--track); font: 400 13px var(--sans); }

input[type='range'] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 99px; background: var(--track); outline: none; }
input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); cursor: pointer; box-shadow: 0 2px 6px rgba(47, 107, 255, 0.4); }
input[type='range']::-moz-range-thumb { width: 20px; height: 20px; border: none; border-radius: 50%; background: var(--blue); cursor: pointer; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 11px 22px; font: 500 12.5px var(--sans); box-shadow: 0 10px 26px rgba(43, 38, 32, 0.3); z-index: 60; }
.empty-full { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--disc-faint); font: 400 14px var(--sans); min-height: 200px; }
.empty-full .cup { width: 60px; height: 60px; font-size: 26px; background: var(--surface); }

/* options, editor, variants tab */
.opt-row { display: flex; flex-wrap: wrap; gap: 7px; }
.opt-chip { padding: 8px 14px; border-radius: 999px; background: var(--bg); color: var(--muted); font: 500 12px var(--sans); cursor: pointer; user-select: none; }
.opt-chip em { font-style: normal; font-weight: 400; color: var(--faint); }
.opt-chip--active { background: var(--ink); color: var(--surface); }
.opt-chip--active em { color: #d8d2c6; }
.photo-row { display: flex; gap: 14px; align-items: center; }
.photo-preview { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; flex: none; }
.photo-placeholder { width: 72px; height: 72px; border-radius: 16px; background: var(--bg); display: flex; align-items: center; justify-content: center; font: 400 10.5px var(--sans); color: var(--faint); flex: none; }
.photo-actions { display: flex; flex-direction: column; gap: 6px; }
.photo-btn { padding: 8px 14px; font: 500 12px var(--sans); display: inline-flex; align-items: center; justify-content: center; }
.photo-hint { font: 400 10.5px var(--sans); color: var(--faint); }
.seg { display: flex; gap: 4px; background: var(--bg); border-radius: 999px; padding: 4px; }
.seg__opt { flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; font: 500 12px var(--sans); cursor: pointer; user-select: none; color: var(--muted); }
.seg__opt--active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(43, 38, 32, 0.08); }
.recipe-row { display: grid; grid-template-columns: 1fr 64px 36px 22px; gap: 8px; align-items: center; }
.recipe-row select, .recipe-row input { background: var(--bg); border: none; border-radius: 10px; padding: 8px 10px; font: 400 12.5px var(--sans); color: var(--ink); min-width: 0; }
.recipe-unit { font: 400 11px var(--sans); color: var(--faint); }
.recipe-del { cursor: pointer; color: var(--faint); text-align: center; user-select: none; }
.recipe-add { align-self: flex-start; font: 500 12px var(--sans); color: var(--blue); cursor: pointer; user-select: none; }
.hpp-box { display: flex; justify-content: space-between; background: var(--bg); border-radius: 12px; padding: 10px 14px; font: 400 12.5px var(--sans); color: var(--muted); }
.hpp-box strong { color: var(--ink); }
.ve-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
.ve-col { background: var(--surface); border-radius: 20px; box-shadow: var(--sh-card); display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.ve-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--divider); font: 500 13px var(--sans); }
.ve-scroll { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.ve-card { border: 1px solid var(--divider); border-radius: 15px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ve-card__head { display: flex; align-items: center; gap: 8px; }
.ve-name { flex: 1; background: var(--bg); border: none; border-radius: 10px; padding: 8px 10px; font: 600 13px var(--sans); color: var(--ink); min-width: 0; }
.ve-del { font: 500 11.5px var(--sans); color: var(--danger-fg); cursor: pointer; user-select: none; }
.ve-choice { background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.ve-choice__top { display: flex; align-items: center; gap: 8px; }
.ve-cl { flex: 1; background: var(--surface); border: none; border-radius: 8px; padding: 7px 9px; font: 500 12.5px var(--sans); color: var(--ink); min-width: 0; }
.ve-delta { display: flex; align-items: center; gap: 4px; font: 400 11.5px var(--sans); color: var(--muted); }
.ve-num { width: 72px; background: var(--surface); border: none; border-radius: 8px; padding: 7px 9px; font: 500 12.5px var(--sans); color: var(--ink); text-align: right; }
.ve-recipe { display: flex; flex-direction: column; gap: 7px; }
.ve-recipe .recipe-row select, .ve-recipe .recipe-row input { background: var(--surface); }
.ve-hint { font: 400 11px var(--sans); color: var(--faint); }
.ve-empty { font: 400 12.5px var(--sans); color: var(--faint); padding: 8px 0; }

@media (max-width: 860px) {
  .app { height: auto; min-height: 100dvh; overflow: visible; flex-direction: column; padding: 10px; gap: 10px; }
  .rail { width: auto; flex-direction: row; border-radius: 16px; padding: 8px 10px; gap: 6px; overflow-x: auto; }

// ---- lookups -------------------------------------------------------------
const prod = sku => state.products.find(p=>p.sku===sku);
const ing = sku => state.ingredients.find(i=>i.sku===sku);
const ogroup = id => state.optionGroups.find(g=>g.id===id);
const addon = id => state.addOns.find(a=>a.id===id);

// ---- pricing / BoM (pure) ------------------------------------------------
function linePrice(line){
  const p = prod(line.sku); if(!p) return 0;
  let price = p.price;
  for(const gid in line.options){ const g=ogroup(gid); const c=g&&g.choices.find(x=>x.id===line.options[gid]); if(c) price+=c.priceDelta; }
  line.addOnIds.forEach(aid=>{ const a=addon(aid); if(a) price+=a.price; });
  return price;
}
function mergeRecipe(items){
  const m=new Map();
  items.forEach(it=>m.set(it.ingredientSku,(m.get(it.ingredientSku)||0)+it.qty));
  return [...m.entries()].map(([ingredientSku,qty])=>({ingredientSku,qty})).filter(x=>x.qty>0);
}
function effectiveRecipe(line){
  const p=prod(line.sku); if(!p) return [];
  const parts=[...p.recipe];
  for(const gid in line.options){ const g=ogroup(gid); const c=g&&g.choices.find(x=>x.id===line.options[gid]); if(c) parts.push(...c.recipeDelta); }
  line.addOnIds.forEach(aid=>{ const a=addon(aid); if(a) parts.push(...a.recipe); });
  return mergeRecipe(parts);
}
function productHPP(p){
  if(p.costManual!=null) return p.costManual;
  return p.recipe.reduce((s,it)=>{ const i=ing(it.ingredientSku); return i? s+(it.qty/i.usageFactor)*i.cost : s; },0);
}
function productMargin(p){ return p.price<=0?0:((p.price-productHPP(p))/p.price)*100; }
function makeableForRecipe(recipe){
  if(!recipe.length) return 0;
  let min=Infinity;
  for(const it of recipe){ if(it.qty<=0) continue; const i=ing(it.ingredientSku); if(!i) return 0; const a=(i.stock*i.usageFactor)/it.qty; if(a<min) min=a; }
  return min===Infinity?0:Math.floor(min);
}
function makeableCount(p){ return p.stockMode==='finished'? p.stock : makeableForRecipe(p.recipe); }
function isLow(p){ return p.stockMode==='finished'? p.stock<20 : makeableCount(p)<10; }
function optionsLabel(line){
  const parts=[];
  state.optionGroups.forEach(g=>{ const cid=line.options[g.id]; if(cid){ const c=g.choices.find(x=>x.id===cid); if(c) parts.push(c.label); } });
  line.addOnIds.forEach(aid=>{ const a=addon(aid); if(a) parts.push('+'+a.name); });
  return parts.join(' · ');
}
function defaultOptions(p){ const o={}; p.optionGroupIds.forEach(gid=>{ const g=ogroup(gid); if(g&&g.choices[0]) o[gid]=g.choices[0].id; }); return o; }
function lineSig(l){ return JSON.stringify({sku:l.sku,o:Object.entries(l.options).sort(),a:[...l.addOnIds].sort(),n:l.note||''}); }
function totals(){
  const sub=state.order.reduce((a,o)=>a+linePrice(o)*o.qty,0);
  const tax=Math.round(sub*state.pajak/100);
  return {sub,tax,tot:sub+tax};
}
function lowStock(){
  return [
    ...state.products.filter(p=>!p.archived&&isLow(p)).map(p=>({name:p.name,label:p.stockMode==='finished'?(p.stock+' tersisa'):(makeableCount(p)+' bisa dibuat')})),
    ...state.ingredients.filter(i=>i.stock<=i.min).map(i=>({name:i.name,label:i.stock+' '+i.unit+' (min '+i.min+')'}))
  ];
}

// ---- photo seam ----------------------------------------------------------
function uploadProductPhoto(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')) return reject(new Error('Berkas harus berupa gambar'));
    if(file.size>8*1024*1024) return reject(new Error('Ukuran gambar melebihi 8 MB'));
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,512/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',0.8));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Gagal memuat gambar')); };
    img.src=url;
  });
}

// ---- mutations -----------------------------------------------------------
let toastTimer=null;
function flash(msg){ state.toast=msg; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{state.toast=null;render();},2400); }

function add(sku,opts){
  opts=opts||{};
  const p=prod(sku); if(!p) return;
  const line={lineId:'',sku,qty:1,options:opts.options||defaultOptions(p),addOnIds:opts.addOnIds||[],note:(opts.note&&opts.note.trim())?opts.note.trim():undefined};
  const avail=p.stockMode==='finished'?p.stock:makeableForRecipe(effectiveRecipe(line));
  if(avail<=0) return flash('Bahan tidak cukup untuk '+p.name);
  const sig=lineSig(line);
  const ex=state.order.find(o=>lineSig(o)===sig);
  const cur=ex?ex.qty:0;
  if(cur>=avail) return flash('Ketersediaan '+p.name+' tersisa '+avail);
  if(ex) ex.qty++; else { line.lineId=uid('ln'); state.order.push(line); }
  render();
}
function chgLine(lineId,d){
  const o=state.order.find(x=>x.lineId===lineId); if(!o) return;
  o.qty+=d;
  if(d>0){ const p=prod(o.sku); const avail=p.stockMode==='finished'?p.stock:makeableForRecipe(effectiveRecipe(o)); if(o.qty>avail) o.qty=avail; }
  state.order=state.order.filter(x=>x.qty>0);
  render();
}
function confirmPay(){
  const t=totals();
  if(state.order.length===0) return;
  if(state.payMethod==='Tunai'&&state.cash<t.tot) return;
  const now=new Date(); const time=String(now.getHours()).padStart(2,'0')+'.'+String(now.getMinutes()).padStart(2,'0');
  const items=state.order.map(o=>{ const p=prod(o.sku); const lbl=optionsLabel(o); return {name:p.name,qty:o.qty,amt:linePrice(o)*o.qty,optionsLabel:lbl||undefined,note:o.note}; });
  // ingredient deduction (recipe products), 3-dp precision
  const delta=new Map();
  state.order.forEach(o=>{ effectiveRecipe(o).forEach(it=>{ const i=ing(it.ingredientSku); if(!i) return; delta.set(it.ingredientSku,(delta.get(it.ingredientSku)||0)+(it.qty/i.usageFactor)*o.qty); }); });
  state.ingredients.forEach(i=>{ if(delta.has(i.sku)) i.stock=Math.max(0,Math.round((i.stock-delta.get(i.sku))*1000)/1000); });
  // finished products decrement stock
  state.products.forEach(p=>{ if(p.stockMode==='finished'){ const sold=state.order.filter(o=>o.sku===p.sku).reduce((a,o)=>a+o.qty,0); if(sold>0) p.stock=Math.max(0,p.stock-sold); } });
  items.forEach(it=>{ state.topCounts[it.name]=(state.topCounts[it.name]||0)+it.qty; });
  const hi=Math.min(11,Math.max(0,now.getHours()-8)); state.hourly[hi]+=t.tot;
  const id='#'+String(state.orderNo).padStart(4,'0');
  state.trx.unshift({id,time,desc:items.map(i=>i.qty+'× '+i.name).join(', '),method:state.payMethod,total:t.tot});
  state.kds.unshift({id,time,type:state.orderType,status:'baru',items:items.map(i=>({qty:i.qty,name:i.name,optionsLabel:i.optionsLabel,note:i.note}))});
  state.lastTrx={id,time,items,sub:t.sub,tax:t.tax,tot:t.tot,method:state.payMethod,cash:state.cash,change:state.payMethod==='Tunai'?state.cash-t.tot:0,type:state.orderType};
  state.sales+=t.tot; state.count++; state.payStage='done'; render();
}
function adjInv(sku,d){
  const p=prod(sku); if(p){ p.stock=Math.max(0,p.stock+d); }
  const i=ing(sku); if(i){ i.stock=Math.max(0,Math.round((i.stock+d)*10)/10); }
  render();
}
function kdsAct(id){
  const k=state.kds.find(x=>x.id===id); if(!k) return;
  if(k.status==='selesai') state.kds=state.kds.filter(x=>x.id!==id);
  else k.status=k.status==='baru'?'proses':'selesai';
  render();
}
// opname
function startOp(){ state.op={items:state.ingredients.map(i=>({sku:i.sku,fisik:''}))}; state.showBA=false; render(); }
function opParsed(){ if(!state.op) return []; return state.op.items.map(it=>{ const i=ing(it.sku); const v=it.fisik.trim()===''?null:parseFloat(it.fisik.replace(',','.')); return {ing:i,fisik:v,raw:it.fisik,ok:v!==null&&!isNaN(v)}; }); }
function finishOp(){ const parsed=opParsed(); if(state.op&&parsed.filter(p=>p.ok).length===parsed.length){ state.showBA=true; render(); } }
function applyOp(){
  const parsed=opParsed();
  state.ingredients.forEach(i=>{ const p=parsed.find(x=>x.ing.sku===i.sku); if(p&&p.ok) i.stock=p.fisik; });
  const diffs=parsed.filter(p=>p.ok&&p.fisik!==p.ing.stock).length;
  const id='SO-'+String(8+(state.opLog.length-2)).padStart(4,'0');
  const date=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  state.opLog.unshift({id,title:'Mingguan — bahan & kemasan',date,diffs});
  state.op=null; state.showBA=false; flash('Berita acara dibuat — stok sistem diperbarui');
}
// product editor
function calcSku(name){ const n=name.trim().toUpperCase().replace(/[^A-Z]/g,''); const cons=n.replace(/[AEIOU]/g,''); return 'BEV-'+(cons+n+'XXX').slice(0,3)+'-'+String(state.products.length+1).padStart(3,'0'); }
function initials(name){ const w=name.trim().split(/\s+/); return (((w[0]||'')[0]||'')+((w[1]?w[1][0]:((w[0]||'')[1]||'')))).toUpperCase(); }
const COLOR_POOL=['#96795B','#7E8D6E','#B08968','#8D6B94','#5E7B8A'];
function openEditor(sku){
  const p=sku?prod(sku):null;
  state.editingSku=sku||null;
  state.ed = p ? {name:p.name,cat:p.cat,price:String(p.price),stockMode:p.stockMode,stock:String(p.stock),photo:p.photo,recipe:p.recipe.map(r=>({...r})),groupIds:[...p.optionGroupIds],addOnIds:[...p.addOnIds],costManual:p.costManual!=null?String(p.costManual):''}
                : {name:'',cat:'Signature',price:'',stockMode:'recipe',stock:'',photo:undefined,recipe:[],groupIds:[],addOnIds:[],costManual:''};
  state.npOpen=true; render();
}
function saveProduct(){
  const d=state.ed; const price=parseInt(d.price,10)||0;
  if(!d.name.trim()||!price) return;
  if(state.editingSku){
    const p=prod(state.editingSku);
    Object.assign(p,{name:d.name.trim(),cat:d.cat,price,stockMode:d.stockMode,stock:d.stockMode==='finished'?(parseInt(d.stock,10)||0):0,photo:d.photo,recipe:d.recipe,optionGroupIds:d.groupIds,addOnIds:d.addOnIds,costManual:d.costManual.trim()===''?undefined:(parseInt(d.costManual,10)||0),initials:initials(d.name)});
    state.npOpen=false; state.editingSku=null; state.ed=null; flash('Produk diperbarui');
  } else {
    const sku=calcSku(d.name);
    state.products.push({sku,name:d.name.trim(),cat:d.cat,price,stock:d.stockMode==='finished'?(parseInt(d.stock,10)||0):0,initials:initials(d.name),color:COLOR_POOL[state.products.length%COLOR_POOL.length],photo:d.photo,stockMode:d.stockMode,recipe:d.recipe,optionGroupIds:d.groupIds,addOnIds:d.addOnIds,costManual:d.costManual.trim()===''?undefined:(parseInt(d.costManual,10)||0)});
    state.npOpen=false; state.editingSku=null; state.ed=null; flash('Produk ditambahkan — '+sku);
  }
}
function deleteProduct(sku){ state.products=state.products.filter(p=>p.sku!==sku); state.order=state.order.filter(o=>o.sku!==sku); state.npOpen=false; state.editingSku=null; state.ed=null; render(); }
function archiveProduct(sku){ const p=prod(sku); if(p) p.archived=!p.archived; state.npOpen=false; state.editingSku=null; state.ed=null; render(); }

function closeModals(){ state.payStage=null; state.npOpen=false; state.editingSku=null; state.ed=null; state.showBA=false; state.setOpen=false; state.os=null; render(); }

// ---- action dispatch -----------------------------------------------------
const ACTS={
  nav:a=>{state.module=a;render();},
  card:a=>{ const p=prod(a); if(p.optionGroupIds.length||p.addOnIds.length){ state.os={sku:a,options:defaultOptions(p),addOnIds:[],note:''}; render(); } else add(a); },
  inc:a=>chgLine(a,1), dec:a=>chgLine(a,-1),
  toggleType:()=>{state.orderType=state.orderType==='Dine-in'?'Takeaway':'Dine-in';render();},
  pay:a=>{state.payMethod=a;render();},
  cat:a=>{state.cat=a;render();},
  openPay:()=>{ if(state.order.length){ state.payStage='ask'; state.cash=0; render(); } },
  closePay:()=>{state.payStage=null;render();},
  cash:a=>{state.cash=Number(a);render();},
  confirmPay:()=>confirmPay(),
  print:()=>flash('Struk dikirim ke printer'),
  newOrder:()=>{state.payStage=null;state.order=[];state.cash=0;state.orderNo++;render();},
  invtab:a=>{state.invTab=a;render();},
  invadj:(a,el)=>adjInv(a,Number(el.getAttribute('data-d'))),
  kds:a=>kdsAct(a),
  setopen:()=>{state.setOpen=true;render();}, setclose:()=>{state.setOpen=false;render();},
  blind:()=>{state.blind=!state.blind;render();},
  startop:()=>startOp(), cancelop:()=>{state.op=null;render();}, finishop:()=>finishOp(), applyop:()=>applyOp(), closeba:()=>{state.showBA=false;render();},
  // option sheet
  osclose:()=>{state.os=null;render();},
  ospick:(a,el)=>{ state.os.options[el.getAttribute('data-g')]=el.getAttribute('data-c'); render(); },
  ostoggle:(a,el)=>{ const id=el.getAttribute('data-a'); const s=state.os.addOnIds; const i=s.indexOf(id); if(i>=0)s.splice(i,1);else s.push(id); render(); },
  osadd:()=>{ const o=state.os; add(o.sku,{options:o.options,addOnIds:o.addOnIds,note:o.note}); state.os=null; },
  // editor
  npopen:a=>openEditor(a||null), npclose:()=>{state.npOpen=false;state.editingSku=null;state.ed=null;render();},
  npsave:()=>saveProduct(), npdel:a=>deleteProduct(a), nparch:a=>archiveProduct(a),
  edmode:a=>{state.ed.stockMode=a;render();},
  edrecadd:()=>{ state.ed.recipe.push({ingredientSku:state.ingredients[0].sku,qty:0}); render(); },
  edrecdel:(a,el)=>{ state.ed.recipe.splice(Number(el.getAttribute('data-idx')),1); render(); },
  edphotodel:()=>{ state.ed.photo=undefined; render(); },
  edgtoggle:a=>{ const s=state.ed.groupIds; const i=s.indexOf(a); if(i>=0)s.splice(i,1);else s.push(a); render(); },
  edatoggle:a=>{ const s=state.ed.addOnIds; const i=s.indexOf(a); if(i>=0)s.splice(i,1);else s.push(a); render(); },
  // variants tab
  vgadd:()=>{ state.optionGroups.push({id:uid('g'),name:'Varian baru',choices:[{id:uid('c'),label:'Pilihan 1',priceDelta:0,recipeDelta:[]}]}); render(); },
  vgdel:a=>{ state.optionGroups=state.optionGroups.filter(g=>g.id!==a); state.products.forEach(p=>p.optionGroupIds=p.optionGroupIds.filter(x=>x!==a)); render(); },
  vcadd:(a,el)=>{ const g=ogroup(el.getAttribute('data-g')); g.choices.push({id:uid('c'),label:'Pilihan',priceDelta:0,recipeDelta:[]}); render(); },
  vcdel:(a,el)=>{ const g=ogroup(el.getAttribute('data-g')); g.choices=g.choices.filter(c=>c.id!==el.getAttribute('data-c')); render(); },
  vcrecadd:(a,el)=>{ const g=ogroup(el.getAttribute('data-g')); const c=g.choices.find(x=>x.id===el.getAttribute('data-c')); c.recipeDelta.push({ingredientSku:state.ingredients[0].sku,qty:0}); render(); },
  vcrecdel:(a,el)=>{ const g=ogroup(el.getAttribute('data-g')); const c=g.choices.find(x=>x.id===el.getAttribute('data-c')); c.recipeDelta.splice(Number(el.getAttribute('data-idx')),1); render(); },
  aoadd:()=>{ state.addOns.push({id:uid('a'),name:'Add-on baru',price:0,recipe:[]}); render(); },
  aodel:a=>{ state.addOns=state.addOns.filter(x=>x.id!==a); state.products.forEach(p=>p.addOnIds=p.addOnIds.filter(x=>x!==a)); render(); },
  aorecadd:(a,el)=>{ const x=addon(el.getAttribute('data-a')); x.recipe.push({ingredientSku:state.ingredients[0].sku,qty:0}); render(); },
  aorecdel:(a,el)=>{ const x=addon(el.getAttribute('data-a')); x.recipe.splice(Number(el.getAttribute('data-idx')),1); render(); }
};

const app=document.getElementById('app');
app.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){ closeModals(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACTS[el.getAttribute('data-act')]; if(fn) fn(el.getAttribute('data-arg'),el);
});
function onInput(e){
  const el=e.target.closest('[data-inp]'); if(!el) return;
  const k=el.getAttribute('data-inp'); const v=el.value;
  if(k==='q') state.q=v;
  else if(k==='invq') state.invQ=v;
  else if(k==='rq') state.rq=v;
  else if(k==='kasir') state.namaKasir=v;
  else if(k==='tax') state.pajak=parseFloat(v);
  else if(k==='fisik'){ const it=state.op.items.find(x=>x.sku===el.getAttribute('data-sku')); if(it) it.fisik=v; }
  else if(k==='os-note') state.os.note=v;
  else if(k==='ed-name') state.ed.name=v;
  else if(k==='ed-price') state.ed.price=v.replace(/[^0-9]/g,'');
  else if(k==='ed-stock') state.ed.stock=v.replace(/[^0-9]/g,'');
  else if(k==='ed-cost') state.ed.costManual=v.replace(/[^0-9]/g,'');
  else if(k==='ed-cat') state.ed.cat=v;
  else if(k==='ed-rq') state.ed.recipe[Number(el.getAttribute('data-idx'))].qty=parseFloat(v.replace(',','.'))||0;
  else if(k==='ed-ring') state.ed.recipe[Number(el.getAttribute('data-idx'))].ingredientSku=v;
  else if(k==='cost'){ const i=ing(el.getAttribute('data-sku')); if(i) i.cost=parseInt(v.replace(/[^0-9]/g,''),10)||0; }
  else if(k==='vg-name'){ ogroup(el.getAttribute('data-g')).name=v; }
  else if(k==='vc-label'){ const g=ogroup(el.getAttribute('data-g')); g.choices.find(c=>c.id===el.getAttribute('data-c')).label=v; }
  else if(k==='vc-price'){ const g=ogroup(el.getAttribute('data-g')); g.choices.find(c=>c.id===el.getAttribute('data-c')).priceDelta=parseInt(v.replace(/[^0-9]/g,''),10)||0; }
  else if(k==='vc-rq'){ const g=ogroup(el.getAttribute('data-g')); g.choices.find(c=>c.id===el.getAttribute('data-c')).recipeDelta[Number(el.getAttribute('data-idx'))].qty=parseFloat(v.replace(',','.'))||0; }
  else if(k==='vc-ring'){ const g=ogroup(el.getAttribute('data-g')); g.choices.find(c=>c.id===el.getAttribute('data-c')).recipeDelta[Number(el.getAttribute('data-idx'))].ingredientSku=v; }
  else if(k==='ao-name'){ addon(el.getAttribute('data-a')).name=v; }
  else if(k==='ao-price'){ addon(el.getAttribute('data-a')).price=parseInt(v.replace(/[^0-9]/g,''),10)||0; }
  else if(k==='ao-rq'){ addon(el.getAttribute('data-a')).recipe[Number(el.getAttribute('data-idx'))].qty=parseFloat(v.replace(',','.'))||0; }
  else if(k==='ao-ring'){ addon(el.getAttribute('data-a')).recipe[Number(el.getAttribute('data-idx'))].ingredientSku=v; }
  render();
}
app.addEventListener('input',onInput);
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.getAttribute&&el.getAttribute('data-inp')&&el.tagName==='SELECT'){ onInput(e); return; }
  if(el.getAttribute&&el.getAttribute('data-inp')==='ed-photo'){
    const file=el.files&&el.files[0]; if(!file) return;
    uploadProductPhoto(file).then(url=>{ state.ed.photo=url; render(); }).catch(err=>flash(err.message));
  }
});

// ---- render helpers ------------------------------------------------------
function diffStyle(d){ return d===0?'badge badge--ok':(d>0?'badge badge--warn':'badge badge--danger'); }
function recipeEditorRows(recipe, inpKind, dataAttrs){
  // dataAttrs: extra attributes string for identifying context (e.g. data-g/data-c or nothing)
  const ingOpts = state.ingredients.map(i=>`<option value="${i.sku}">${esc(i.name)}</option>`).join('');
  const rows = recipe.map((r,idx)=>{
    const i=ing(r.ingredientSku);
    const sel = state.ingredients.map(x=>`<option value="${x.sku}"${x.sku===r.ingredientSku?' selected':''}>${esc(x.name)}</option>`).join('');
    return `<div class="recipe-row">
      <select data-inp="${inpKind}-ring" ${dataAttrs} data-idx="${idx}">${sel}</select>
      <input data-inp="${inpKind}-rq" ${dataAttrs} data-idx="${idx}" value="${escA(String(r.qty))}" inputmode="decimal">
      <span class="recipe-unit">${i?esc(i.usageUnit):''}</span>

    </div>`;
  }).join('');
  return rows;
}

// ---- inventory -----------------------------------------------------------
function invHtml(){
  const tab=(id,l)=>`<span class="tab${state.invTab===id?' tab--active':''}" data-act="invtab" data-arg="${id}">${l}</span>`;
  const iql=state.invQ.trim().toLowerCase();
  const match=(n,s)=>iql===''||n.toLowerCase().includes(iql)||s.toLowerCase().includes(iql);
  const head=`<header class="topbar"><span class="topbar__title">Inventory</span>
    <span class="tabs">${tab('menu','Menu')}${tab('bahan','Bahan &amp; kemasan')}${tab('varian','Varian &amp; Add-on')}</span><span class="spacer"></span>
    ${state.invTab!=='varian'?`<input class="search" style="width:190px" data-inp="invq" data-fid="invq" value="${escA(state.invQ)}" placeholder="Cari nama / SKU…">`:''}
    ${state.invTab==='menu'?`<span class="pill-add" data-act="npopen">+ Produk baru</span>`:''}</header>`;

  if(state.invTab==='varian') return `<div class="mod">${head}${variantsHtml()}</div>`;

  if(state.invTab==='menu'){
    const cols='120px 1.3fr 0.9fr 84px 84px 64px 70px 84px';
    const rows=state.products.filter(p=>match(p.name,p.sku)).map(p=>{
      const low=isLow(p), avail=makeableCount(p), hpp=productHPP(p), m=productMargin(p);
      return `<div class="trow trow--click" style="grid-template-columns:${cols};opacity:${p.archived?0.5:1}" data-act="npopen" data-arg="${p.sku}">
        <span class="mono" style="color:var(--faint)">${p.sku}</span>
        <span style="font:500 14px var(--serif)">${esc(p.name)}${p.archived?'<em class="arch-tag"> arsip</em>':''}</span>
        <span style="color:var(--muted)">${esc(p.cat)}</span>
        <span style="text-align:right;color:var(--muted)">${f(p.price)}</span>
        <span style="text-align:right;color:var(--muted)">${f(hpp)}</span>
        <span style="text-align:right;color:${m<0?'var(--danger-fg)':'var(--ok-fg)'}">${m.toFixed(0)}%</span>
        <span style="text-align:center;font:600 13px var(--sans)">${p.stockMode==='recipe'?avail:p.stock}</span>
        <span style="text-align:right"><span class="${low?'badge badge--danger':'badge badge--ok'}">${low?'Menipis':'Aman'}</span></span></div>`;
    }).join('');
    const n=state.products.filter(p=>match(p.name,p.sku)).length;
    return `<div class="mod">${head}<div class="tablecard"><div class="tablescroll"><div class="tableinner">
      <div class="thead" style="grid-template-columns:${cols}"><span>SKU</span><span>Nama</span><span>Kategori</span><span style="text-align:right">Harga</span><span style="text-align:right">HPP</span><span style="text-align:right">Margin</span><span style="text-align:center">Stok</span><span style="text-align:right">Status</span></div>
      ${rows}</div></div><div class="tfoot">${n} produk · klik baris untuk edit · SKU otomatis BEV-XXX-###</div></div></div>`;
  }
  // bahan
  const cols='120px 1.4fr 96px 90px 96px 150px 90px';
  const rows=state.ingredients.filter(i=>match(i.name,i.sku)).map(i=>{
    const low=i.stock<=i.min;
    return `<div class="trow" style="grid-template-columns:${cols}">
      <span class="mono" style="color:var(--faint)">${i.sku}</span>
      <span style="font:500 14px var(--serif)">${esc(i.name)}</span>
      <span style="text-align:right"><input class="cost-input" data-inp="cost" data-sku="${i.sku}" data-fid="cost-${i.sku}" value="${escA(String(i.cost))}" inputmode="numeric"></span>
      <span style="text-align:right;color:var(--muted)">${i.min} ${i.unit}</span>
      <span style="text-align:center;color:var(--muted)">${i.usageUnit} (×${i.usageFactor})</span>
      <span style="display:flex;align-items:center;justify-content:center;gap:9px"><span class="stepbtn" data-act="invadj" data-arg="${i.sku}" data-d="-1">−</span><strong style="font:600 13px var(--sans);min-width:44px;text-align:center">${i.stock} ${i.unit}</strong><span class="stepbtn" data-act="invadj" data-arg="${i.sku}" data-d="1">+</span></span>
      <span style="text-align:right"><span class="${low?'badge badge--danger':'badge badge--ok'}">${low?'Menipis':'Aman'}</span></span></div>`;
  }).join('');
  const n=state.ingredients.filter(i=>match(i.name,i.sku)).length;
  return `<div class="mod">${head}<div class="tablecard"><div class="tablescroll"><div class="tableinner">
    <div class="thead" style="grid-template-columns:${cols}"><span>SKU</span><span>Nama</span><span style="text-align:right">Cost/unit</span><span style="text-align:right">Minimum</span><span style="text-align:center">Satuan pakai</span><span style="text-align:center">Stok</span><span style="text-align:right">Status</span></div>
    ${rows}</div></div><div class="tfoot">${n} SKU · cost dipakai untuk hitung HPP · satuan pakai untuk resep</div></div></div>`;
}

function variantsHtml(){
  const groups=state.optionGroups.map(g=>`<div class="ve-card">

    ${g.choices.map(c=>`<div class="ve-choice">

    </div>`).join('')}

      <span class="ve-del" data-act="aodel" data-arg="${a.id}">Hapus</span></div>
    <div class="ve-recipe">${recipeEditorRows(a.recipe,'ao',`data-a="${a.id}"`)}<span class="recipe-add" data-act="aorecadd" data-a="${a.id}">+ bahan</span></div>
    <div class="ve-hint">Harga: ${f(a.price)}</div></div>`).join('');
  return `<div class="ve-grid">
    <div class="ve-col"><div class="ve-head"><span>Varian (single-choice)</span><span class="pill-add" data-act="vgadd">+ Varian</span></div><div class="ve-scroll">${groups||'<div class="ve-empty">Belum ada varian.</div>'}</div></div>
    <div class="ve-col"><div class="ve-head"><span>Add-on (multi-pilih)</span><span class="pill-add" data-act="aoadd">+ Add-on</span></div><div class="ve-scroll">${aos||'<div class="ve-empty">Belum ada add-on.</div>'}</div></div>
  </div>`;
}

// ---- kds / riwayat / opname (same as base, with option labels) -----------
function kdsHtml(){
  const mapSt={baru:['Baru','color:var(--blue);background:var(--blue-tint)'],proses:['Diproses','color:var(--warn-fg);background:var(--warn-bg)'],selesai:['Selesai','color:var(--ok-fg);background:var(--ok-bg)']};
  const mapAct={baru:['Mulai buat','background:var(--ink);color:var(--surface)'],proses:['Tandai selesai','background:var(--blue);color:#fff'],selesai:['Bersihkan','background:var(--bg);color:var(--muted)']};
  const cards=state.kds.map(k=>{
    const items=k.items.map(ki=>`<div class="kdsitem"><strong class="kdsqty">${ki.qty}×</strong><span>${esc(ki.name)}${ki.optionsLabel?`<em class="kdsopt"> · ${esc(ki.optionsLabel)}</em>`:''}${ki.note?`<em class="kdsnote"> — “${esc(ki.note)}”</em>`:''}</span></div>`).join('');
    return `<div class="kdscard"><div class="kdscard__head"><span class="kds__id">${k.id}</span><span class="kds__time">${k.time}</span><span style="margin-left:auto"><span class="badge" style="${mapSt[k.status][1]};font-size:10.5px">${mapSt[k.status][0]}</span></span></div>
      <span class="typechip">${k.type}</span><div class="kds__items">${items}</div>
      <div class="kds__act" style="${mapAct[k.status][1]}" data-act="kds" data-arg="${k.id}">${mapAct[k.status][0]}</div></div>`;
  }).join('');
  const empty=state.kds.length===0?`<div class="empty-full"><span class="cup">☕</span>Belum ada antrean — semua pesanan selesai</div>`:'';
  return `<div class="mod"><header class="topbar"><span class="topbar__title">Layar Barista</span><span class="badge" style="color:var(--blue);background:var(--blue-tint)">${state.kds.length} antrean</span><span class="spacer"></span><span class="clock">Pesanan masuk otomatis dari kasir</span></header>
    ${empty}<div class="kds-scroll"><div class="kds-grid">${cards}</div></div></div>`;
}
function riwayatHtml(){
  const cols='90px 80px 1fr 120px 130px';
  const rql=state.rq.trim().toLowerCase();
  const rows=state.trx.filter(x=>rql===''||x.id.toLowerCase().includes(rql)||x.desc.toLowerCase().includes(rql)||String(x.method).toLowerCase().includes(rql)).map(x=>`<div class="trow" style="grid-template-columns:${cols}"><span class="mono">${x.id}</span><span style="color:var(--muted)">${x.time}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.desc)}</span><span><span class="method-chip">${x.method}</span></span><strong style="font:600 13.5px var(--sans);text-align:right">${f(x.total)}</strong></div>`).join('');
  const sum=state.trx.reduce((a,x)=>a+x.total,0);
  return `<div class="mod"><header class="topbar"><span class="topbar__title">Riwayat Transaksi</span><span class="spacer"></span><input class="search" style="width:230px;max-width:50vw" data-inp="rq" data-fid="rq" value="${escA(state.rq)}" placeholder="Cari nomor / item / metode…"></header>
    <div class="tablecard"><div class="tablescroll"><div class="tableinner"><div class="thead" style="grid-template-columns:${cols}"><span>No</span><span>Waktu</span><span>Item</span><span>Metode</span><span style="text-align:right">Total</span></div>${rows}</div></div>
    <div class="tfoot">${state.trx.length} transaksi tercatat hari ini · total ${f(sum)}</div></div></div>`;
}
function opHtml(){
  const badge='MINGGUAN · '+(state.blind?'BLIND COUNT':'COUNT TERBUKA');
  const head=`<header class="topbar"><span class="topbar__title">Stock Opname</span><span class="spacer"></span>${state.op?`<span class="badge" style="color:var(--blue);background:var(--blue-tint);font-size:10.5px">${badge}</span>`:''}</header>`;
  const nextId='SO-'+String(8+(state.opLog.length-2)).padStart(4,'0');
  if(!state.op){
    const log=state.opLog.map(l=>`<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--divider);font:400 13px var(--sans)"><span class="mono" style="color:var(--faint)">${l.id}</span><span style="flex:1;font:500 14px var(--serif)">${esc(l.title)}</span><span style="color:var(--muted)">${l.date}</span><span class="${l.diffs===0?'badge badge--ok':'badge badge--danger'}">${l.diffs===0?'Semua sesuai':l.diffs+' selisih'}</span></div>`).join('');
    return `<div class="mod">${head}<div class="op-start">
      <div class="op-card"><span class="op-card__title">Mulai sesi baru</span>
        <span class="op-note">Sesi <strong style="color:var(--ink)">${nextId}</strong> · Mingguan — semua bahan &amp; kemasan (${state.ingredients.length} SKU). Stok sistem dibekukan selama penghitungan.</span>
        <div class="toggle-row" data-act="blind"><span class="toggle${state.blind?' toggle--on':''}"><span class="toggle__knob"></span></span><span style="flex:1"><span style="display:block;font:500 13px var(--sans)">Blind count</span><span style="font:400 11.5px var(--sans);color:var(--faint)">Stok sistem disembunyikan saat input</span></span></div>
        <div class="btn btn--blue" style="padding:14px 0;font:600 13.5px var(--sans)" data-act="startop">Mulai penghitungan</div>
        <span class="op-note--faint">Saran ritme: spot-check harian bahan kritis saat closing · mingguan penuh · blind count bulanan.</span></div>
      <div class="op-hist"><span style="font:500 13px var(--sans);margin-bottom:10px">Riwayat sesi</span><div style="flex:1;overflow-y:auto">${log}</div></div></div></div>`;
  }
  const parsed=opParsed(); const counted=parsed.filter(p=>p.ok).length; const allc=counted===parsed.length;
  const cols='130px 1.7fr 110px 150px 110px';
  const rows=parsed.map(p=>{
    const sys=state.blind?'•••':(p.ing.stock+' '+p.ing.unit);
    let diff='—',ds='font:500 11px var(--sans);color:var(--disc-faint)';
    if(p.ok){ const d=Math.round((p.fisik-p.ing.stock)*10)/10; diff=(d>0?'+':'')+d; ds=diffStyle(p.fisik-p.ing.stock); }
    return `<div class="trow" style="grid-template-columns:${cols}"><span class="mono" style="color:var(--faint)">${p.ing.sku}</span>
      <span style="font:500 14px var(--serif)">${esc(p.ing.name)} <span style="font:400 11.5px var(--sans);color:var(--faint2)">${p.ing.unit}</span></span>
      <span style="text-align:right;color:var(--muted)">${sys}</span>
      <span style="display:flex;justify-content:center"><input class="fisik" data-inp="fisik" data-sku="${p.ing.sku}" data-fid="fisik-${p.ing.sku}" value="${escA(p.raw)}" placeholder="0" inputmode="decimal"></span>
      <span style="text-align:right"><span class="${p.ok?ds:''}" style="${p.ok?'':ds}">${diff}</span></span></div>`;
  }).join('');
  return `<div class="mod">${head}
    <div class="op-progress"><span class="progress"><span class="progress__fill" style="width:${Math.round(counted/Math.max(1,parsed.length)*100)}%"></span></span><span style="font:400 12px var(--sans);color:var(--muted)">${counted}/${parsed.length} item dihitung</span></div>
    <div class="tablecard"><div class="tablescroll"><div class="tableinner"><div class="thead" style="grid-template-columns:${cols}"><span>SKU</span><span>Bahan</span><span style="text-align:right">Sistem</span><span style="text-align:center">Fisik</span><span style="text-align:right">Selisih</span></div>${rows}</div></div>
    <div class="op-actions"><span class="btn btn--ghost" style="flex:1;padding:12px 0;font:500 12.5px var(--sans)" data-act="cancelop">Batalkan sesi</span><span class="btn ${allc?'btn--blue':'btn--disabled'}" style="flex:1.4;padding:12px 0;font:600 12.5px var(--sans)" data-act="finishop">Selesaikan &amp; buat berita acara</span></div></div></div>`;
}

// ---- modals --------------------------------------------------------------
function payModal(){
  if(state.payStage===null) return '';
  const t=totals();
  let inner='';
  if(state.payStage==='ask'){
    let body='';
    if(state.payMethod==='Tunai'){
      const qv=[t.tot,Math.ceil(t.tot/10000)*10000,Math.ceil(t.tot/50000)*50000,100000,150000,200000].filter((v,i,a)=>a.indexOf(v)===i&&v>=t.tot).slice(0,6);
      const qc=qv.map((v,i)=>`<span class="quick${state.cash===v?' quick--active':''}" data-act="cash" data-arg="${v}">${i===0&&v===t.tot?'Uang pas':f(v).replace('Rp ','')}</span>`).join('');
      body=`<div class="quickgrid">${qc}</div><div class="cash-row"><span>Diterima <strong style="color:var(--ink)">${f(state.cash)}</strong></span><span>Kembalian <strong style="color:${state.cash>=t.tot?'var(--ok-fg)':'var(--danger-fg)'}">${f(Math.max(0,state.cash-t.tot))}</strong></span></div>`;
    } else if(state.payMethod==='QRIS'){ body=`<div class="qr">Kode QRIS tampil di sini — pelanggan scan &amp; bayar</div>`; }
    else { body=`<div class="edc">${state.payMethod==='Kartu'?'Gesek / tap kartu pelanggan di mesin EDC, lalu konfirmasi di sini.':'Minta pelanggan bayar lewat GoPay / OVO / Dana, lalu konfirmasi di sini.'}</div>`; }
    const cashOk=state.payMethod!=='Tunai'||state.cash>=t.tot;
    inner=`<div class="modal__head"><span class="modal__title">Pembayaran — ${state.payMethod}</span><span class="close" data-act="closePay">✕</span></div>
      <div class="pay-total"><span class="pay-total__label">Total tagihan</span><div class="pay-total__value">${f(t.tot)}</div></div>${body}
      <div class="btn ${cashOk?'btn--dark':'btn--disabled'}" style="padding:14px 0;font:600 13.5px var(--sans)" data-act="${cashOk?'confirmPay':''}">${state.payMethod==='Tunai'?'Terima pembayaran':'Konfirmasi terbayar'}</div>`;
  } else {
    const lt=state.lastTrx;
    const rows=[...lt.items.map(i=>({l:i.qty+' × '+i.name+(i.optionsLabel?' ('+i.optionsLabel+')':''),r:f(i.amt)})),{l:'Subtotal',r:f(lt.sub)},{l:'Pajak PB1 '+state.pajak+'%',r:f(lt.tax)}].map(rr=>`<div class="receipt__row"><span>${esc(rr.l)}</span><span>${rr.r}</span></div>`).join('');
    inner=`<div class="success-check">✓</div><div style="text-align:center"><div style="font:600 19px var(--serif)">Pembayaran berhasil</div><span style="font:400 12px var(--sans);color:var(--faint)">Transaksi ${lt.id} · ${lt.time} · ${lt.type}</span></div>
      <div class="receipt">${rows}<div class="receipt__divider"></div><div class="receipt__total"><span>Total</span><span>${f(lt.tot)}</span></div><div style="display:flex;justify-content:space-between;font:400 12px var(--sans);color:var(--muted)"><span>Metode: ${lt.method}</span><span>${lt.method==='Tunai'?'Kembalian '+f(lt.change):''}</span></div></div>
      <div class="btn-row"><span class="btn btn--ghost" style="flex:1;padding:12px 0;font:500 12.5px var(--sans)" data-act="print">Cetak struk</span><span class="btn btn--dark" style="flex:1.2;padding:12px 0;font:500 12.5px var(--sans)" data-act="newOrder">Pesanan baru</span></div>`;
  }
  return `<div class="overlay"><div class="modal">${inner}</div></div>`;
}
function baModal(){
  if(!state.showBA) return '';
  const parsed=opParsed(); const nextId='SO-'+String(8+(state.opLog.length-2)).padStart(4,'0');
  const diffs=parsed.filter(p=>p.ok&&p.fisik!==p.ing.stock);
  const sum=diffs.length===0?'Seluruh hitungan fisik cocok dengan stok sistem.':diffs.length+' SKU selisih dari '+parsed.length+' item dihitung. Terapkan untuk menyesuaikan stok sistem ke hasil fisik.';
  const body=diffs.length===0?`<div style="padding:14px 0;font:400 13px var(--sans);color:var(--ok-fg)">Semua stok sesuai sistem ✓</div>`:diffs.map(p=>{const d=Math.round((p.fisik-p.ing.stock)*10)/10;return `<div class="ba-row"><span style="flex:1;font:500 14px var(--serif)">${esc(p.ing.name)}</span><span style="color:var(--muted)">${p.ing.stock} → ${p.fisik} ${p.ing.unit}</span><span class="${diffStyle(d)}">${(d>0?'+':'')+d}</span></div>`;}).join('');
  return `<div class="overlay"><div class="modal modal--wide"><div class="modal__head"><span class="modal__title">Berita acara — ${nextId}</span><span class="close" data-act="closeba">✕</span></div>
    <span style="font:400 12.5px var(--sans);color:var(--muted)">${sum}</span><div class="ba-list">${body}</div>
    <div class="btn-row"><span class="btn btn--ghost" style="flex:1;padding:13px 0;font:500 12.5px var(--sans)" data-act="closeba">Kembali</span><span class="btn btn--blue" style="flex:1.4;padding:13px 0;font:600 12.5px var(--sans)" data-act="applyop">Terapkan penyesuaian stok</span></div></div></div>`;
}
function editorModal(){
  if(!state.npOpen) return '';
  const d=state.ed; const editing=state.editingSku;
  const price=parseInt(d.price,10)||0;
  const tempP={price,recipe:d.recipe,costManual:d.costManual.trim()===''?undefined:(parseInt(d.costManual,10)||0)};
  const hpp=tempP.costManual!=null?tempP.costManual:d.recipe.reduce((s,it)=>{const i=ing(it.ingredientSku);return i?s+(it.qty/i.usageFactor)*i.cost:s;},0);
  const margin=price<=0?0:((price-hpp)/price)*100;
  const valid=d.name.trim().length>0&&price>0;
  const skuLabel=editing?editing:calcSku(d.name);
  const cats=['Signature','Espresso Based','Kopi Susu','Non-Kopi'].map(c=>`<option value="${c}"${d.cat===c?' selected':''}>${c}</option>`).join('');
  const photo=d.photo?`<img class="photo-preview" src="${escA(d.photo)}" alt="preview">`:`<span class="photo-placeholder">Tanpa foto</span>`;
  const recipeBlock = d.stockMode==='finished'
    ? `<label class="field">Stok awal<input data-inp="ed-stock" data-fid="ed-stock" value="${escA(d.stock)}" inputmode="numeric" placeholder="0"></label>`
    : `<div class="field" style="gap:8px">Resep (per 1 cup)${recipeEditorRows(d.recipe,'ed','')}<span class="recipe-add" data-act="edrecadd">+ bahan</span></div>`;
  const grps=state.optionGroups.map(g=>`<span class="opt-chip${d.groupIds.includes(g.id)?' opt-chip--active':''}" data-act="edgtoggle" data-arg="${g.id}">${esc(g.name)}</span>`).join('')||`<span class="photo-hint">Belum ada varian</span>`;
  const aos=state.addOns.map(a=>`<span class="opt-chip${d.addOnIds.includes(a.id)?' opt-chip--active':''}" data-act="edatoggle" data-arg="${a.id}">${esc(a.name)}</span>`).join('')||`<span class="photo-hint">Belum ada add-on</span>`;
  return `<div class="overlay"><div class="modal" style="width:460px;gap:12px">
    <div class="modal__head"><span class="modal__title">${editing?'Edit produk':'Produk baru'}</span><span class="close" data-act="npclose">✕</span></div>
    <div class="photo-row">${photo}<div class="photo-actions">
      <label class="btn btn--ghost photo-btn">${d.photo?'Ganti foto':'Unggah foto'}<input type="file" accept="image/*" data-inp="ed-photo" hidden></label>
      ${d.photo?`<span class="btn btn--ghost photo-btn" data-act="edphotodel">Hapus foto</span>`:''}
      <span class="photo-hint">Dikompres ke ≤512px. Kosong → disc inisial.</span></div></div>
    <label class="field">Nama produk<input data-inp="ed-name" data-fid="ed-name" value="${escA(d.name)}" placeholder="mis. Butterscotch Latte"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label class="field">Kategori<select data-inp="ed-cat">${cats}</select></label>
      <label class="field">Harga (Rp)<input data-inp="ed-price" data-fid="ed-price" value="${escA(d.price)}" inputmode="numeric" placeholder="28000"></label></div>
    <div class="field" style="gap:8px">Jenis stok<div class="seg"><span class="seg__opt${d.stockMode==='recipe'?' seg__opt--active':''}" data-act="edmode" data-arg="recipe">Racikan (resep)</span><span class="seg__opt${d.stockMode==='finished'?' seg__opt--active':''}" data-act="edmode" data-arg="finished">Retail (stok jadi)</span></div></div>
    ${recipeBlock}
    <div class="hpp-box"><span>HPP <strong>${f(hpp)}</strong></span><span>Margin <strong style="color:${margin<0?'var(--danger-fg)':'var(--ok-fg)'}">${margin.toFixed(1)}%</strong></span></div>
    <label class="field">HPP manual (opsional — kosong = otomatis)<input data-inp="ed-cost" data-fid="ed-cost" value="${escA(d.costManual)}" inputmode="numeric" placeholder="otomatis dari resep"></label>
    <div class="field" style="gap:8px">Varian berlaku<div class="opt-row">${grps}</div></div>
    <div class="field" style="gap:8px">Add-on berlaku<div class="opt-row">${aos}</div></div>
    <div class="sku-auto">SKU ${editing?'':'otomatis'}<span class="sku-code">${skuLabel}</span></div>
    <div class="btn-row" style="margin-top:2px">
      ${editing?`<span class="btn btn--ghost" style="padding:13px 14px;font:500 12.5px var(--sans)" data-act="nparch" data-arg="${editing}">${prod(editing).archived?'Aktifkan':'Arsip'}</span><span class="btn btn--ghost" style="padding:13px 14px;font:500 12.5px var(--sans);color:var(--danger-fg)" data-act="npdel" data-arg="${editing}">Hapus</span>`:''}
      <span class="btn btn--ghost" style="flex:1;padding:13px 0;font:500 12.5px var(--sans)" data-act="npclose">Batal</span>
      <span class="btn ${valid?'btn--blue':'btn--disabled'}" style="flex:1.3;padding:13px 0;font:600 12.5px var(--sans)" data-act="${valid?'npsave':''}">${editing?'Simpan':'Simpan produk'}</span></div>
  </div></div>`;
}
function setModal(){
  if(!state.setOpen) return '';
  return `<div class="overlay"><div class="modal" style="gap:16px"><div class="modal__head"><span class="modal__title">Pengaturan</span><span class="close" data-act="setclose">✕</span></div>
    <label class="field" style="gap:10px"><span>Pajak PB1 <strong style="color:var(--ink);font:600 13px var(--sans)">${state.pajak}%</strong></span>
      <input type="range" data-inp="tax" data-fid="tax" min="0" max="15" step="0.5" value="${state.pajak}"><span style="display:flex;justify-content:space-between;font:400 10.5px var(--sans);color:var(--faint2)"><span>0%</span><span>15%</span></span></label>
    <label class="field">Nama kasir<input data-inp="kasir" data-fid="kasir" value="${escA(state.namaKasir)}" placeholder="Nadia"></label>
    <span class="op-note--faint">Pajak diterapkan ke seluruh transaksi (subtotal × rate, dibulatkan). Nama kasir tampil di header shift &amp; avatar rail.</span>
    <div class="btn-row"><span class="btn btn--dark" style="flex:1;padding:13px 0;font:500 12.5px var(--sans)" data-act="setclose">Selesai</span></div></div></div>`;
}

// ---- main render ---------------------------------------------------------
function render(){
  const ae=document.activeElement; let fid=null,ss=null,se=null;
  if(ae&&ae.getAttribute&&ae.getAttribute('data-fid')){ fid=ae.getAttribute('data-fid'); try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){} }
  let mod='';
  if(state.module==='kasir') mod=kasirHtml();
  else if(state.module==='dash') mod=dashHtml();
  else if(state.module==='inv') mod=invHtml();
  else if(state.module==='op') mod=opHtml();
  else if(state.module==='kds') mod=kdsHtml();
  else if(state.module==='riwayat') mod=riwayatHtml();
  const toast=state.toast?`<div class="toast">${esc(state.toast)}</div>`:'';
  app.innerHTML=`<div class="app">${railHtml()}${mod}${optionSheetHtml()}${payModal()}${baModal()}${editorModal()}${setModal()}${toast}</div>`;
  if(fid){ const el=app.querySelector('[data-fid="'+(window.CSS&&CSS.escape?CSS.escape(fid):fid.replace(/"/g,'\\"'))+'"]'); if(el){ el.focus(); if(ss!=null){ try{el.setSelectionRange(ss,se);}catch(e){} } } }
}
render();
setInterval(()=>{ if(state.module==='kasir'&&!state.payStage&&!state.os) render(); },30000);

</script>
</body>
</html>
