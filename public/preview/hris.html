  --k-hijau: var(--panel); --k-pink: var(--panel); --k-biru: var(--panel); --k-kuning: var(--panel); --k-ungu: var(--panel); --k-putih: var(--panel);
  --kartu-r: 20px; --kartu-b: 1px solid var(--line); --kartu-sh: none;
  --btn-r: 12px; --btn-b: 1px solid transparent; --btn-sh: none;
  --side-bg: #0a0a0a; --side-ink: #a6a8b2; --side-aktif-bg: #fff; --side-aktif-ink: #0a0a0a; --side-b: 1px solid var(--line);
  --f-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-display: "Archa", "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  --judul-case: none; --judul-ls: -.03em;
  --input-bg: #0f0f10; --input-b: 1px solid var(--line-2);
  --th-bg: transparent; --th-ink: var(--muted);
  --modal-bg: #121214; --overlay: rgba(0,0,0,.66);
  color-scheme: dark;
}
html[data-tema="nb"] {
  --bg: #fff3d6; --bg-pola: radial-gradient(#e2c98f 1px, transparent 1.3px);
  --panel: #ffffff; --panel-2: #fff8e6; --panel-3: #fff3d6;
  --ink: #111111; --ink-2: #222; --muted: #4a4a4a; --faint: #7a7364;
  --line: #111111; --line-2: #111111;
  --primer: #124bce; --primer-2: #1d57dd; --tint: #124bce; --magenta: #de236e;
  --ok: #0f7a47; --warn: #8a5a00; --bad: #b4124f; --info: #1d3fb0; --ungu: #5b2bb5; --jingga: #a34a00;
  --ok-bg: #5fe3a1; --warn-bg: #ffd23f; --bad-bg: #ff90c8; --info-bg: #7aa2ff; --ungu-bg: #c3a6ff; --abu-bg: #ffffff; --jingga-bg: #ff9f5a;
  --k-hijau: #5fe3a1; --k-pink: #ff90c8; --k-biru: #7aa2ff; --k-kuning: #ffd23f; --k-ungu: #c3a6ff; --k-putih: #ffffff;
  --kartu-r: 10px; --kartu-b: 3px solid #111; --kartu-sh: 6px 6px 0 #111;
  --btn-r: 8px; --btn-b: 2.5px solid #111; --btn-sh: 3px 3px 0 #111;
  --side-bg: #124bce; --side-ink: #ffffff; --side-aktif-bg: #ffd23f; --side-aktif-ink: #111; --side-b: 3px solid #111;
  --f-body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --f-display: "Archivo Black", "Arial Black", ui-sans-serif, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --judul-case: uppercase; --judul-ls: .01em;
  --input-bg: #fff; --input-b: 2.5px solid #111;
  --th-bg: #111; --th-ink: #fff;
  --modal-bg: #fff; --overlay: rgba(40,30,10,.45);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); background-image: var(--bg-pola); background-size: 20px 20px;
  color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 1.15em; height: 1.15em; flex: none; }
a { color: inherit; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
html[data-tema="nb"] :focus-visible { outline: 3px solid #de236e; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ───────── Kerangka ───────── */
.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side-bg); color: var(--side-ink);
  border-right: var(--side-b); display: flex; flex-direction: column; padding: 28px 18px 18px; gap: 6px;
}
html[data-tema="nb"] .side { margin: 16px 0 16px 16px; height: calc(100vh - 32px); top: 16px; border: 3px solid #111; border-radius: 12px; box-shadow: 6px 6px 0 #111; }
.logo { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 22px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.logo img { height: 26px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
.logo small { font-size: 11px; letter-spacing: .06em; color: var(--muted); line-height: 1.5; }
.logo-nb { display: none; align-items: center; gap: 10px; }
html[data-tema="nb"] .logo { border-bottom: 0; padding-bottom: 14px; }
html[data-tema="nb"] .logo img, html[data-tema="nb"] .logo small { display: none; }
html[data-tema="nb"] .logo-nb { display: flex; }
.logo-nb b { width: 46px; height: 46px; border-radius: 10px; background: #ffd23f; color: #111; border: 3px solid #111; box-shadow: 3px 3px 0 #111; display: grid; place-items: center; font-family: var(--f-display); font-size: 17px; transform: rotate(-6deg); }
.logo-nb span { font-family: var(--f-display); font-size: 17px; line-height: 1.05; color: #fff; }
.logo-nb span em { display: block; font-style: normal; font-family: var(--f-body); font-weight: 800; font-size: 10px; letter-spacing: .16em; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding: 14px 14px 4px; font-weight: 700; }
html[data-tema="nb"] .nav-sub { color: rgba(255,255,255,.7); }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; text-decoration: none;
  color: var(--side-ink); font-weight: 500; font-size: 15px; border: 2.5px solid transparent; transition: background .15s, color .15s;
}
.nav a svg { width: 20px; height: 20px; flex: none; opacity: .9; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.aktif { background: var(--side-aktif-bg); color: var(--side-aktif-ink); font-weight: 650; }
html[data-tema="nb"] .nav a { font-weight: 700; border-radius: 8px; }
html[data-tema="nb"] .nav a:hover { background: rgba(255,255,255,.14); }
html[data-tema="nb"] .nav a.aktif { border-color: #111; box-shadow: 4px 4px 0 #111; }
.nav a .hit { margin-left: auto; font-size: 11px; font-weight: 800; background: var(--magenta); color: #fff; border-radius: 99px; padding: 1px 7px; }
.side-akun { margin-top: auto; padding-top: 14px; }
.akun { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
html[data-tema="nb"] .akun { border: 3px solid #111; border-radius: 10px; box-shadow: 4px 4px 0 #111; background: #fff; }
.akun div { min-width: 0; flex: 1; }
.akun b { display: block; font-size: 13px; }
.akun small { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.akun button { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; }
.akun button:hover { color: var(--bad); }

.main { min-width: 0; padding: 34px 44px 60px; }
html[data-tema="nb"] .main { padding: 26px 36px 60px 32px; }
.topm { display: none; }

/* ───────── Kepala halaman ───────── */
.kepala { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 28px; }
.kepala-teks { min-width: 0; }
.judul { font-family: var(--f-display); font-weight: 900; font-size: 40px; letter-spacing: var(--judul-ls); line-height: 1.05; margin: 0; text-transform: var(--judul-case); text-wrap: balance; }
html[data-tema="nb"] .judul { font-size: 46px; }
.sub { color: var(--muted); margin: 10px 0 0; font-size: 15.5px; max-width: 70ch; }
.kepala-aksi { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.chip-tgl {
  display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--primer-2);
  font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 0;
}
.chip-tgl:hover { text-decoration: underline dotted; }
html[data-tema="nb"] .chip-tgl { background: #5fe3a1; color: #111; border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; border-radius: 8px; padding: 6px 12px; letter-spacing: 0; text-transform: none; font-size: 13px; transform: rotate(-2deg); }
.periode { font-size: 13px; color: var(--muted); }
html[data-tema="nb"] .periode { color: #111; font-weight: 600; }

.demo-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.demo-tag { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); border-radius: 99px; padding: 4px 10px; }
html[data-tema="nb"] .demo-tag { color: #111; border: 2px solid #111; }

/* ───────── Tombol, isian, pil ───────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--btn-r); border: var(--btn-b);
  box-shadow: var(--btn-sh); padding: 10px 16px; font-weight: 650; font-size: 14px; background: var(--panel-2); color: var(--ink);
  transition: transform .08s, background .15s, box-shadow .08s; white-space: nowrap; text-decoration: none;
}
.btn svg { width: 17px; height: 17px; }
.btn:hover { background: var(--panel-3); }
html[data-tema="nb"] .btn { background: #fff; font-weight: 800; }
html[data-tema="nb"] .btn:hover { background: #fff8e6; }
html[data-tema="nb"] .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #111; }
.btn-primer { background: var(--primer-2); color: #fff; }
.btn-primer:hover { background: #3a6ae0; }
html[data-tema="nb"] .btn-primer { background: #7aa2ff; color: #111; }
html[data-tema="nb"] .btn-primer:hover { background: #8fb2ff; }
.btn-ok { background: var(--ok-bg); color: var(--ok); }
html[data-tema="nb"] .btn-ok { background: #5fe3a1; color: #111; }
.btn-no { background: transparent; color: var(--muted); }
html[data-tema="nb"] .btn-no { background: #fff; color: #111; }
.btn-bahaya { background: var(--bad-bg); color: var(--bad); }
html[data-tema="nb"] .btn-bahaya { background: #ff90c8; color: #111; }
.btn-kecil { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
html[data-tema="nb"] .btn-kecil { box-shadow: 2px 2px 0 #111; border-width: 2px; }
.btn-ikon { padding: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.ikon-btn { position: relative; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.ikon-btn svg { width: 21px; height: 21px; }
html[data-tema="nb"] .ikon-btn { border: 3px solid #111; border-radius: 10px; box-shadow: 4px 4px 0 #111; background: #ffd23f; }
.ikon-btn .titik { position: absolute; top: -7px; right: -7px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 99px; background: var(--magenta); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }

.input, .select, textarea.input {
  width: 100%; border-radius: 12px; border: var(--input-b); background: var(--input-bg); color: var(--ink); padding: 10px 13px; font-size: 14px;
}
html[data-tema="nb"] .input, html[data-tema="nb"] .select { border-radius: 8px; }
.input::placeholder { color: var(--faint); }
.cari { position: relative; }
.cari svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
.cari .input { padding-left: 40px; }
html[data-tema="nb"] .cari .input { box-shadow: 4px 4px 0 #111; height: 46px; min-width: 260px; }
.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 6px; letter-spacing: .02em; }
html[data-tema="nb"] .lbl { color: #111; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.form { display: grid; gap: 14px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

.pil { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; border-radius: 8px; padding: 3px 9px; white-space: nowrap; background: var(--abu-bg); color: var(--ink-2); }
.pil.hijau { background: var(--ok-bg); color: var(--ok); }
.pil.kuning { background: var(--warn-bg); color: var(--warn); }
.pil.pink { background: var(--bad-bg); color: var(--bad); }
.pil.biru { background: var(--info-bg); color: var(--info); }
.pil.ungu { background: var(--ungu-bg); color: var(--ungu); }
.pil.jingga { background: var(--jingga-bg); color: var(--jingga); }
html[data-tema="nb"] .pil { color: #111 !important; border: 2px solid #111; box-shadow: 2px 2px 0 #111; border-radius: 6px; font-weight: 800; }
.pil-kecil { font-size: 10.5px; padding: 2px 7px; letter-spacing: .04em; text-transform: uppercase; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #fff; background: var(--magenta); border-radius: 6px; padding: 2px 8px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: denyut 1.6s infinite; }
@keyframes denyut { 50% { opacity: .25; } }
html[data-tema="nb"] .live { border: 2px solid #111; }

/* ───────── Kartu ───────── */
.kartu { background: var(--panel); border: var(--kartu-b); border-radius: var(--kartu-r); box-shadow: var(--kartu-sh); min-width: 0; }
.kartu-isi { padding: 24px 26px; }
.kartu-kepala { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 26px 16px; flex-wrap: wrap; }
.kartu-kepala h2, .kartu-kepala h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
html[data-tema="nb"] .kartu-kepala h2, html[data-tema="nb"] .kartu-kepala h3 { font-family: var(--f-display); text-transform: uppercase; font-size: 19px; font-weight: 400; letter-spacing: .02em; }
.kartu-kepala p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.kartu-garis { border-top: 1px solid var(--line); }
html[data-tema="nb"] .kartu-garis { border-top: 3px solid #111; }
.label-kecil { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
html[data-tema="nb"] .label-kecil { color: #111; letter-spacing: .1em; font-weight: 800; }
.kosong { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.grid-dasbor { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.kolom { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; min-width: 0; }
html[data-tema="nb"] .grid, html[data-tema="nb"] .grid-2, html[data-tema="nb"] .grid-3 { gap: 26px; }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; margin-bottom: 24px; }
.kpi-grid.empat { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { text-align: left; background: var(--panel); border: var(--kartu-b); border-radius: var(--kartu-r); box-shadow: var(--kartu-sh); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; overflow: hidden; }
button.kpi:hover { border-color: var(--line-2); }
html[data-tema="nb"] button.kpi:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #111; }
.kpi .nilai { font-family: var(--f-display); font-weight: 900; font-size: 42px; line-height: 1; letter-spacing: -.02em; }
html[data-tema="nb"] .kpi .nilai { font-size: 50px; }
.kpi small { font-size: 12.5px; color: var(--muted); }
html[data-tema="nb"] .kpi small { color: #111; font-weight: 600; }
.kpi[data-w="hijau"] { background: var(--k-hijau); } .kpi[data-w="hijau"] .nilai { color: var(--ok); }
.kpi[data-w="pink"] { background: var(--k-pink); } .kpi[data-w="pink"] .nilai { color: var(--bad); }
.kpi[data-w="biru"] { background: var(--k-biru); } .kpi[data-w="biru"] .nilai { color: var(--info); }
.kpi[data-w="kuning"] { background: var(--k-kuning); } .kpi[data-w="kuning"] .nilai { color: var(--warn); }
.kpi[data-w="ungu"] { background: var(--k-ungu); } .kpi[data-w="ungu"] .nilai { color: var(--ungu); }
.kpi[data-w="putih"] .nilai { color: var(--ink); }
html[data-tema="nb"] .kpi .nilai { color: #111 !important; }
html[data-tema="gelap"] .kpi[data-garis]::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 3px; background: var(--g); }

/* Tabel */
.tabel-wrap { overflow-x: auto; position: relative; }
.tabel { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabel th { text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--th-ink); background: var(--th-bg); font-weight: 800; padding: 12px 18px; white-space: nowrap; border-bottom: 1px solid var(--line); }
.tabel td { padding: 13px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabel tr:last-child td { border-bottom: 0; }
.tabel tbody tr:hover td { background: rgba(255,255,255,.02); }
html[data-tema="nb"] .tabel td { border-bottom: 2px solid #111; }
html[data-tema="nb"] .tabel tbody tr:hover td { background: #fff8e6; }
.tabel .kanan { text-align: right; }
.orang { display: flex; align-items: center; gap: 12px; min-width: 0; }
.orang b { display: block; font-weight: 650; font-size: 14.5px; line-height: 1.25; }
html[data-tema="nb"] .orang b { font-weight: 800; }
.orang small { display: block; color: var(--muted); font-size: 12px; }
.tautan { background: none; border: 0; padding: 0; color: var(--tint); font-weight: 600; text-decoration: none; }
.tautan:hover { text-decoration: underline; }
html[data-tema="nb"] .tautan { color: #111; text-decoration: underline; text-decoration-thickness: 2px; font-weight: 700; }

/* Avatar */
.av { --c: #2b5cd5; width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: color-mix(in srgb, var(--c) 22%, #111); color: color-mix(in srgb, var(--c) 70%, #fff); }
.av.besar { width: 72px; height: 72px; font-size: 24px; }
.av.kecil { width: 30px; height: 30px; font-size: 11px; }
html[data-tema="nb"] .av { background: var(--c); color: #111; border: 2.5px solid #111; }

/* Daftar & baris */
.daftar { display: grid; gap: 10px; }
.baris { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); min-width: 0; }
html[data-tema="nb"] .baris { background: #fff; border: 2.5px solid #111; border-radius: 8px; box-shadow: 3px 3px 0 #111; }
.baris > div { min-width: 0; }
.baris b { font-weight: 650; }
.pengajuan { padding: 16px 18px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); display: grid; gap: 10px; }
html[data-tema="nb"] .pengajuan { background: #fff8e6; border: 2.5px solid #111; border-radius: 8px; }
.pengajuan-kepala { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pengajuan p { margin: 0; color: var(--muted); font-size: 13px; }
.pengajuan q { color: var(--ink-2); font-style: italic; font-size: 13px; }
html[data-tema="nb"] .pengajuan p { color: #111; }
.aksi-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.aksi-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

/* Grafik batang */
.batang { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; align-items: end; height: 220px; padding: 10px 26px 0; }
.batang-kol { display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
.batang-kol span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
html[data-tema="nb"] .batang-kol span { color: #111; font-weight: 700; }
.batang-kol i { display: block; width: 100%; border-radius: 10px 10px 4px 4px; background: linear-gradient(180deg, var(--primer-2), #173a9a); min-height: 4px; }
.batang-kol i.ini { background: linear-gradient(180deg, var(--magenta), #8f1747); }
html[data-tema="nb"] .batang-kol i { background: #7aa2ff; border: 3px solid #111; border-radius: 4px 4px 0 0; }
html[data-tema="nb"] .batang-kol:nth-child(odd) i { background: #ffd23f; }
html[data-tema="nb"] .batang-kol i.ini { background: #ff90c8; }
.batang-x { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; padding: 8px 26px 22px; border-top: 1px solid var(--line); margin-top: 0; }
html[data-tema="nb"] .batang-x { border-top: 3px solid #111; }
.batang-x span { text-align: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
html[data-tema="nb"] .batang-x span { color: #111; font-weight: 700; }

/* Donat */
.donat-wrap { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
.donat { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.donat > div { width: 128px; height: 128px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; text-align: center; }
.donat b { font-size: 36px; font-weight: 800; line-height: 1; display: block; }
.legenda { flex: 1; min-width: 200px; display: grid; gap: 10px; }
.legenda div { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.legenda i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legenda span { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Progres */
.progres { height: 10px; background: var(--panel-3); border-radius: 99px; overflow: hidden; }
.progres i { display: block; height: 100%; background: var(--primer-2); border-radius: 99px; }
html[data-tema="nb"] .progres { height: 22px; border: 2.5px solid #111; border-radius: 4px; background: #fff; }
html[data-tema="nb"] .progres i { background: #ffd23f; border-radius: 0; border-right: 2.5px solid #111; }

/* Tab */
.tab { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab button { border: 0; background: transparent; padding: 10px 14px; font-weight: 650; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.tab button.aktif { color: var(--ink); border-bottom-color: var(--primer-2); }
html[data-tema="nb"] .tab { border-bottom: 0; gap: 10px; }
html[data-tema="nb"] .tab button { border: 2.5px solid #111; border-radius: 8px; background: #fff; color: #111; box-shadow: 3px 3px 0 #111; font-weight: 800; margin: 0; }
html[data-tema="nb"] .tab button.aktif { background: #ffd23f; }
.segmen { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.segmen button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; font-weight: 650; font-size: 13px; color: var(--muted); }
.segmen button.aktif { background: var(--panel-3); color: var(--ink); }
html[data-tema="nb"] .segmen { border: 2.5px solid #111; background: #fff; border-radius: 8px; }
html[data-tema="nb"] .segmen button { color: #111; }
html[data-tema="nb"] .segmen button.aktif { background: #111; color: #fff; }

/* Sakelar */
.sakelar { position: relative; width: 46px; height: 26px; border-radius: 99px; border: 0; background: var(--panel-3); flex: none; transition: background .2s; }
.sakelar::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.sakelar[aria-checked="true"] { background: var(--primer-2); }
.sakelar[aria-checked="true"]::after { transform: translateX(20px); }
html[data-tema="nb"] .sakelar { border: 2.5px solid #111; background: #fff; height: 28px; width: 50px; }
html[data-tema="nb"] .sakelar::after { background: #111; top: 2px; left: 2px; }
html[data-tema="nb"] .sakelar[aria-checked="true"] { background: #5fe3a1; }

/* Modal */
.modal-latar { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 18px; z-index: 100; animation: muncul .16s ease-out; }
@keyframes muncul { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100dvh - 36px); display: flex; flex-direction: column; background: var(--modal-bg); border: 1px solid var(--line-2); border-radius: 22px; overflow: hidden; animation: naik .2s cubic-bezier(.16,1,.3,1); }
.modal.lebar { width: min(820px, 100%); }
@keyframes naik { from { transform: translateY(14px) scale(.98); } }
html[data-tema="nb"] .modal { border: 3px solid #111; border-radius: 12px; box-shadow: 8px 8px 0 #111; }
.modal-kepala { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
html[data-tema="nb"] .modal-kepala { background: #fff3d6; border-bottom: 3px solid #111; }
.modal-kepala h3 { margin: 0; font-size: 17px; }
html[data-tema="nb"] .modal-kepala h3 { font-family: var(--f-display); text-transform: uppercase; font-weight: 400; font-size: 17px; }
.modal-isi { padding: 20px 24px; overflow-y: auto; }
.modal-kaki { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
html[data-tema="nb"] .modal-kaki { background: #fff3d6; border-top: 3px solid #111; }

/* Toast */
.toast-tempat { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; width: min(420px, calc(100% - 32px)); }
.toast { background: #1d1d20; color: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,.4); animation: naik .2s; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast.gagal::before { background: var(--bad); }
.toast.info::before { background: var(--info); }
html[data-tema="nb"] .toast { background: #fff; color: #111; border: 3px solid #111; border-radius: 8px; box-shadow: 5px 5px 0 #111; font-weight: 700; }
html[data-tema="nb"] .toast::before { width: 12px; height: 12px; border: 2px solid #111; background: #5fe3a1; }
html[data-tema="nb"] .toast.gagal::before { background: #ff90c8; }

/* Panel lonceng */
.panel-lonceng { position: absolute; right: 0; top: 56px; width: 340px; z-index: 60; }
.panel-lonceng .kartu { padding: 8px; }
.notif { display: flex; gap: 10px; padding: 12px; border-radius: 12px; align-items: flex-start; }
.notif:hover { background: var(--panel-2); }
.notif i { width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); flex: none; margin-top: 7px; }

/* Kalender */
.kal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.kal span { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding: 4px 0; letter-spacing: .06em; }
.kal button { aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent; background: var(--panel-2); font-weight: 650; font-size: 13px; color: var(--ink); position: relative; }
.kal button.lain { opacity: .3; }
.kal button.minggu { color: var(--bad); }
.kal button.libur { background: var(--bad-bg); color: var(--bad); }
.kal button.cuti { background: var(--jingga-bg); color: var(--jingga); }
.kal button.ini { outline: 2px solid var(--primer-2); }
html[data-tema="nb"] .kal button { border: 2px solid #111; border-radius: 6px; background: #fff; }
html[data-tema="nb"] .kal button.libur { background: #ff90c8; color: #111; }
html[data-tema="nb"] .kal button.cuti { background: #ff9f5a; color: #111; }
html[data-tema="nb"] .kal button.ini { background: #ffd23f; outline: 0; box-shadow: 3px 3px 0 #111; }

/* Portal karyawan: kartu jam */
.jam-kartu { padding: 24px; }
html[data-tema="nb"] .jam-kartu { background: #ffd23f; position: relative; }
.jam-atas { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.jam-besar { font-family: var(--f-display); font-weight: 900; font-size: 76px; line-height: 1; letter-spacing: -.03em; margin: 18px 0 6px; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 10px; }
.jam-besar small { font-family: var(--f-body); font-size: 15px; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
html[data-tema="nb"] .jam-besar { background: #fff; border: 3px solid #111; border-radius: 8px; padding: 18px 20px; justify-content: space-between; font-size: 72px; }
html[data-tema="nb"] .jam-besar small { color: #111; }
.stempel { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: 99px; background: var(--abu-bg); color: var(--ink-2); }
html[data-tema="nb"] .stempel { position: absolute; top: -16px; right: 18px; background: #fff; color: #111; border: 2.5px solid #111; border-radius: 6px; box-shadow: 3px 3px 0 #111; transform: rotate(4deg); }
.mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.mode button { border-radius: 12px; border: 1px solid var(--line-2); background: transparent; padding: 11px; font-weight: 700; color: var(--muted); }
.mode button.aktif { background: var(--ink); color: var(--bg); border-color: var(--ink); }
html[data-tema="nb"] .mode button { border: 2.5px dashed #111; border-radius: 8px; background: #fff3d6; color: #555; }
html[data-tema="nb"] .mode button.aktif { border-style: solid; background: #111; color: #fff; }
.tombol-absen { width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; letter-spacing: .02em; border: 0; color: #fff; background: linear-gradient(135deg, var(--primer-2), #0f3aa6); display: flex; align-items: center; justify-content: center; gap: 12px; }
.tombol-absen svg { width: 22px; height: 22px; }
.tombol-absen.keluar { background: linear-gradient(135deg, #de236e, #9c1550); }
.tombol-absen[disabled] { background: var(--panel-3); color: var(--muted); cursor: not-allowed; }
html[data-tema="nb"] .tombol-absen { background: #ff90c8; color: #111; border: 3px solid #111; border-radius: 10px; box-shadow: 5px 5px 0 #111; font-family: var(--f-display); font-weight: 400; font-size: 20px; text-transform: uppercase; }
html[data-tema="nb"] .tombol-absen.keluar { background: #7aa2ff; }
html[data-tema="nb"] .tombol-absen[disabled] { background: #fff; color: #777; box-shadow: none; }
.ubin-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.ubin { padding: 16px; text-align: center; }
.ubin b { display: block; font-family: var(--f-display); font-size: 32px; line-height: 1.1; font-weight: 900; }
.ubin small { font-size: 12px; color: var(--muted); font-weight: 600; }
html[data-tema="nb"] .ubin small { color: #111; font-weight: 800; }
html[data-tema="nb"] .ubin { box-shadow: 4px 4px 0 #111; }

.kamera { aspect-ratio: 4 / 3; border-radius: 16px; background: radial-gradient(circle at 50% 38%, #3b3f4a 0 18%, transparent 18.5%), radial-gradient(ellipse at 50% 92%, #3b3f4a 0 36%, transparent 36.5%), linear-gradient(160deg, #20232b, #0d0e12); position: relative; overflow: hidden; display: grid; place-items: center; }
.kamera::after { content: ""; position: absolute; inset: 14% 24%; border: 2px dashed rgba(255,255,255,.35); border-radius: 50%; }
.kamera span { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 6px; }
html[data-tema="nb"] .kamera { border: 3px solid #111; border-radius: 8px; }
.selfie { width: 44px; height: 44px; border-radius: 10px; background: radial-gradient(circle at 50% 38%, #8a8f9c 0 20%, transparent 21%), radial-gradient(ellipse at 50% 100%, #8a8f9c 0 40%, transparent 41%), #2a2d35; flex: none; }

/* Daily task */
.papan-grup { border-left: 4px solid var(--g, var(--primer-2)); }
.papan-grup h3 { color: var(--g); }
html[data-tema="nb"] .papan-grup { border-left: 3px solid #111; }
html[data-tema="nb"] .papan-grup h3 { color: #111; background: var(--g); padding: 2px 10px; border: 2.5px solid #111; border-radius: 6px; }
.status-sel { border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: 12px; text-align: center; min-width: 140px; color: #fff; appearance: none; -webkit-appearance: none; }
html[data-tema="nb"] .status-sel { border: 2.5px solid #111; color: #111; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 16px; overflow-x: auto; padding-bottom: 6px; }
.kanban-kol { background: var(--panel); border: var(--kartu-b); border-radius: var(--kartu-r); box-shadow: var(--kartu-sh); padding: 14px; display: grid; gap: 10px; align-content: start; min-height: 220px; }
.tugas { padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: grid; gap: 6px; }
html[data-tema="nb"] .tugas { border: 2.5px solid #111; border-radius: 8px; background: #fff; box-shadow: 3px 3px 0 #111; }

/* Chat */
.chat { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: calc(100dvh - 180px); min-height: 480px; overflow: hidden; }
.chat-daftar { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; display: grid; gap: 4px; align-content: start; }
html[data-tema="nb"] .chat-daftar { border-right: 3px solid #111; background: #fff8e6; }
.chat-daftar button { text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
.chat-daftar button.aktif { background: var(--panel-3); color: var(--ink); }
html[data-tema="nb"] .chat-daftar button.aktif { background: #ffd23f; border: 2px solid #111; }
.chat-daftar button b { font-weight: 650; display: block; font-size: 14px; }
.chat-daftar button small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 170px; }
.chat-ruang { display: flex; flex-direction: column; min-width: 0; }
.chat-pesan { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.pesan { display: flex; gap: 10px; max-width: 76%; }
.pesan.saya { align-self: flex-end; flex-direction: row-reverse; }
.gelembung { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 9px 13px; font-size: 14px; }
.pesan.saya .gelembung { background: var(--primer); border-color: transparent; color: #fff; border-radius: 14px 14px 4px 14px; }
html[data-tema="nb"] .gelembung { background: #fff; border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; }
html[data-tema="nb"] .pesan.saya .gelembung { background: #7aa2ff; color: #111; border: 2.5px solid #111; }
.gelembung small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; font-weight: 700; }
.pesan.saya .gelembung small { color: rgba(255,255,255,.75); }
html[data-tema="nb"] .pesan.saya .gelembung small { color: #111; }
.chat-tulis { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
html[data-tema="nb"] .chat-tulis { border-top: 3px solid #111; }

/* Slip */
.slip { font-size: 14px; }
.slip h4 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slip-baris { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
html[data-tema="nb"] .slip-baris { border-bottom: 1.5px dashed #111; }
.slip-baris span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.slip-total { display: flex; justify-content: space-between; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--info-bg); font-weight: 800; font-size: 16px; }
html[data-tema="nb"] .slip-total { border: 3px solid #111; border-radius: 8px; }

/* Info baris (profil) */
.info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 26px; }
.info div small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.info div span { display: block; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
html[data-tema="nb"] .info div small { color: #111; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 20% 0%, rgba(18,75,206,.35), transparent 55%), radial-gradient(ellipse at 100% 100%, rgba(222,35,110,.18), transparent 50%), #070708; color: #f5f5f7; }
.login-kartu { width: min(440px, 100%); background: rgba(20,20,22,.9); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 34px 30px; display: grid; gap: 18px; }
.login-kartu img { height: 30px; width: auto; filter: brightness(0) invert(1); justify-self: start; }
.login-kartu h1 { font-family: "Archa", "Inter", sans-serif; font-size: 30px; margin: 4px 0 0; letter-spacing: -.02em; }
.login-kartu p { margin: 0; color: #9ca0ab; }
.login-kartu .input { background: #0d0d0f; border: 1px solid rgba(255,255,255,.12); color: #fff; }
.login-kartu .lbl { color: #9ca0ab; }
.login-peran { display: grid; gap: 10px; }
.login-peran button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.1); background: #111114; color: #fff; }
.login-peran button:hover { border-color: #2b5cd5; background: #13182a; }
.login-peran button b { display: block; }
.login-peran button small { color: #9ca0ab; }
.login-catatan { font-size: 12px; color: #8b8d98; border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }

/* Nav bawah (ponsel) */
.navbawah { display: none; }

/* Pemilih tema */
.tema-btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 99px; padding: 7px 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-weight: 700; font-size: 12.5px; }
.tema-btn i { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(90deg, #0a0a0a 50%, #ffd23f 50%); border: 1.5px solid currentColor; }
html[data-tema="nb"] .tema-btn { border: 2.5px solid #111; box-shadow: 3px 3px 0 #111; border-radius: 8px; }

/* ───────── Responsif ───────── */
@media (max-width: 1240px) {
  .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-dasbor { grid-template-columns: minmax(0, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 90; left: 0; top: 0; width: 280px; transform: translateX(-105%); transition: transform .25s; }
  html[data-tema="nb"] .side { margin: 0; top: 0; height: 100vh; border-radius: 0 12px 12px 0; }
  .app.menu-buka .side { transform: none; }
  .app.menu-buka::after { content: ""; position: fixed; inset: 0; background: var(--overlay); z-index: 80; }
  .main, html[data-tema="nb"] .main { padding: 18px 16px 110px; }
  .topm { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 18px; }
  .topm img { height: 20px; filter: brightness(0) invert(1); }
  html[data-tema="nb"] .topm img { filter: none; }
  .judul, html[data-tema="nb"] .judul { font-size: 30px; }
  .kpi-grid, .kpi-grid.empat { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kpi { padding: 16px 18px; }
  .kpi .nilai, html[data-tema="nb"] .kpi .nilai { font-size: 34px; }
  .grid-2, .grid-3, .form-2, .info { grid-template-columns: minmax(0, 1fr); }
  .kartu-isi { padding: 18px; } .kartu-kepala { padding: 18px 18px 12px; }
  .tabel th, .tabel td { padding: 11px 12px; }
  .batang, .batang-x { gap: 8px; padding-left: 14px; padding-right: 14px; }
  .chat { grid-template-columns: minmax(0, 1fr); height: auto; }
  .chat-daftar { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
  .chat-daftar button small { display: none; }
  .chat-pesan { min-height: 340px; max-height: 55dvh; }
  .pesan { max-width: 90%; }
  .jam-besar, html[data-tema="nb"] .jam-besar { font-size: 56px; }
  .ubin-4 { grid-template-columns: repeat(2, 1fr); }
  .sembunyi-hp { display: none !important; }
  .cari .input, html[data-tema="nb"] .cari .input { min-width: 0; }
  .panel-lonceng { position: fixed; left: 16px; right: 16px; top: 70px; width: auto; }
  .portal .navbawah { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: rgba(18,18,20,.92); backdrop-filter: blur(14px); border: 1px solid var(--line-2); border-radius: 20px; padding: 6px; }
  html[data-tema="nb"] .portal .navbawah { background: #111; border: 3px solid #111; border-radius: 14px; }

/* ===================================================================
   DATA CONTOH — seluruhnya fiktif (nama, email, angka). Dibangkitkan
   ulang setiap kali halaman dibuka, relatif terhadap tanggal hari ini.
   =================================================================== */
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const tambahHari = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dariIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const BLN = BULAN.map((b) => b.slice(0, 3));
const HARI = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
const keMenit = (j) => { const [h, m] = String(j || "0:0").split(":").map(Number); return h * 60 + m; };
const keJam = (m) => `${pad2(Math.floor(m / 60) % 24)}:${pad2(Math.round(m % 60))}`;
const rupiah = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
const tglPanjang = (d) => `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
const tglPendek = (s) => { const d = dariIso(s); return `${d.getDate()} ${BLN[d.getMonth()]}`; };

// Pseudo-acak berbiji: hasil sama setiap kali dibuka di hari yang sama
function acakBiji(biji) { let s = biji >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const HARI_INI = new Date();
const HARI_INI_ISO = iso(HARI_INI);
const rnd = acakBiji(Number(HARI_INI_ISO.replace(/-/g, "")));

function periodeGaji(d = HARI_INI) {
  const awal = d.getDate() >= 21 ? new Date(d.getFullYear(), d.getMonth(), 21) : new Date(d.getFullYear(), d.getMonth() - 1, 21);
  const akhir = new Date(awal.getFullYear(), awal.getMonth() + 1, 20);
  return { dari: iso(awal), sampai: iso(akhir), label: `${awal.getDate()} ${BLN[awal.getMonth()]} – ${akhir.getDate()} ${BLN[akhir.getMonth()]} ${akhir.getFullYear()}`, bulan: BULAN[akhir.getMonth()] + " " + akhir.getFullYear() };

/* ── Pencarian data ── */
const emp = (id) => S.d.karyawan.find((e) => e.id === id) || { nama: "?", panggilan: "?", warna: "#999", id };
const staf = () => S.d.karyawan.filter((e) => !e.owner && e.isAktif);
const inisial = (nama) => String(nama || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((s) => s[0]).join("").toUpperCase();
const av = (id, ukuran = "") => { const e = emp(id); return `<span class="av ${ukuran}" style="--c:${e.warna}" aria-hidden="true">${esc(inisial(e.nama))}</span>`; };
const pil = (teks, w = "", kelas = "") => `<span class="pil ${w} ${kelas}">${esc(teks)}</span>`;
const tanggalDalam = (str, t) => { const m = String(str || "").match(/\d{4}-\d{2}-\d{2}/g) || []; if (!m.length) return false; const a = m[0], b = m[1] || m[0]; return t >= a && t <= b; };
const teksTanggalPengajuan = (str) => { const m = String(str || "").match(/\d{4}-\d{2}-\d{2}/g) || []; if (!m.length) return esc(str); return m.length > 1 && m[1] !== m[0] ? `${tglPendek(m[0])} – ${tglPendek(m[1])}` : tglPendek(m[0]); };
const isRemote = (j) => /WFH|WFC/.test(j);
const isLibur = (t) => S.d.libur.find((l) => l.tanggal === t && l.jenis !== "masuk");
const isHariKerja = (d) => d.getDay() !== 0 && d.getDay() !== 6 && !isLibur(iso(d));
const warnaJenis = (j) => /Sakit/.test(j) ? "pink" : /Cuti/.test(j) ? "kuning" : /WFH|WFC/.test(j) ? "biru" : /Terlambat/.test(j) ? "jingga" : "ungu";
const warnaStatus = (s) => s === "Disetujui" ? "hijau" : s === "Ditolak" ? "pink" : "kuning";
const terlambatMenit = (a) => { const e = emp(a.idKaryawan); return Math.max(0, keMenit(a.waktuMasuk) - keMenit(e.jamMasuk)); };

function ringkasHariIni(t = HARI_INI_ISO) {
  const list = staf();
  const abs = S.d.absensi.filter((a) => a.tanggal === t);
  const izin = S.d.pengajuan.filter((p) => p.status === "Disetujui" && tanggalDalam(p.tanggal, t) && !/Terlambat/.test(p.jenis));
  const idAbs = new Set(abs.map((a) => a.idKaryawan));
  const cuti = izin.filter((p) => !isRemote(p.jenis) && !idAbs.has(p.idKaryawan));
  const remote = abs.filter((a) => a.mode_kerja !== "Kantor");
  const telat = abs.filter((a) => a.status === "Terlambat");
  const tepat = abs.filter((a) => a.status !== "Terlambat");
  const idCuti = new Set(cuti.map((c) => c.idKaryawan));
  const belum = list.filter((e) => !idAbs.has(e.id) && !idCuti.has(e.id));
  return { list, abs, tepat, telat, remote, cuti, belum };
}

function rekap(id, dari, sampai) {
  const abs = S.d.absensi.filter((a) => a.idKaryawan === id && a.tanggal >= dari && a.tanggal <= sampai);
  const telat = abs.filter((a) => a.status === "Terlambat");
  const izin = S.d.pengajuan.filter((p) => p.idKaryawan === id && p.status === "Disetujui" && !isRemote(p.jenis) && !/Terlambat/.test(p.jenis) && (String(p.tanggal).match(/\d{4}-\d{2}-\d{2}/g) || []).some((x) => x >= dari && x <= sampai));
  const lembur = abs.reduce((s, a) => s + (a.lembur_menit || 0), 0);
  const menitTelat = telat.reduce((s, a) => s + terlambatMenit(a), 0);
  return { hadir: abs.length, telat: telat.length, tepat: abs.length - telat.length, izin: izin.length, lembur, menitTelat, abs };
}

function tujuhHariKerja() {
  const hasil = []; let d = new Date(HARI_INI);
  while (hasil.length < 7) { if (isHariKerja(d) || iso(d) === HARI_INI_ISO) hasil.unshift(iso(d)); d = tambahHari(d, -1); }
  const n = staf().length;
  return hasil.map((t) => ({ t, pct: Math.round((new Set(S.d.absensi.filter((a) => a.tanggal === t).map((a) => a.idKaryawan)).size / n) * 100) }));
}

/* ── Kalender libur (dipakai Dasbor HR & Kehadiran) ── */
function htmlKalender(bulanIso, bisaUbah = false) {
  const awal = dariIso(bulanIso.slice(0, 7) + "-01");
  const mulai = tambahHari(awal, -((awal.getDay() + 6) % 7)); // Senin
  let sel = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map((h) => `<span>${h}</span>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = tambahHari(mulai, i), t = iso(d), l = S.d.libur.find((x) => x.tanggal === t);
    const kelas = [d.getMonth() !== awal.getMonth() ? "lain" : "", d.getDay() === 0 ? "minggu" : "", l ? (l.jenis === "cuti" ? "cuti" : "libur") : "", t === HARI_INI_ISO ? "ini" : ""].join(" ");
    sel += `<button type="button" class="${kelas}" ${bisaUbah ? `data-a="kal-tgl" data-t="${t}"` : "tabindex=-1"} title="${l ? esc(l.nama) : t}">${d.getDate()}</button>`;
  }
  const bulanIni = S.d.libur.filter((l) => l.tanggal.slice(0, 7) === bulanIso.slice(0, 7)).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn btn-kecil btn-ikon" data-a="kal-geser" data-n="-1" aria-label="Bulan sebelumnya">${ik("kiri")}</button>
      <b style="font-size:16px">${BULAN[awal.getMonth()]} ${awal.getFullYear()}</b>
      <button class="btn btn-kecil btn-ikon" data-a="kal-geser" data-n="1" aria-label="Bulan berikutnya">${ik("kanan")}</button></div>
    <div class="kal">${sel}</div>
    <div class="daftar" style="margin-top:16px">${bulanIni.length ? bulanIni.map((l) => `<div class="baris"><div><b>${esc(l.nama)}</b><div class="muted" style="font-size:12.5px">${tglPanjang(dariIso(l.tanggal))}</div></div>${pil(l.jenis === "cuti" ? "Cuti bersama" : l.jenis === "kantor" ? "Libur kantor" : "Nasional", l.jenis === "cuti" ? "jingga" : l.jenis === "kantor" ? "biru" : "pink")}${bisaUbah ? `<button class="btn btn-kecil btn-no" data-a="hapus-libur" data-t="${l.tanggal}">Hapus</button>` : ""}</div>`).join("") : `<div class="kosong">Tidak ada tanggal merah di bulan ini.</div>`}</div>
    ${bisaUbah ? `<p class="hint">Klik tanggal untuk menambah libur kantor.</p>` : ""}`;
}
function bukaKalender(bisaUbah = false) {
  if (!S.ui.kalBulan) S.ui.kalBulan = HARI_INI_ISO;
  S.ui.kalUbah = bisaUbah;
  bukaModal({ judul: "Kalender tanggal merah", isi: `<div id="kal-isi">${htmlKalender(S.ui.kalBulan, bisaUbah)}</div>` });

const RUTE = {};
// Rute disimpan di status, bukan hanya di alamat: tetap jalan di pratinjau/iframe yang
// memblokir perubahan alamat. Alamat (#/…) hanya diperbarui bila diizinkan.
function ruteSaatIni() { if (S.rute) return S.rute; let h = ""; try { h = location.hash; } catch (e) { /* abaikan */ } return h || "#/login"; }
function ke(h, ganti = false) {
  S.rute = h; S.menuBuka = false; S.lonceng = false;
  try { if (location.hash !== h) history[ganti ? "replaceState" : "pushState"](null, "", h); } catch (e) { /* alamat tak bisa diubah — tak masalah */ }
  render(); try { window.scrollTo(0, 0); } catch (e) { /* abaikan */ }
}
function render() {
  document.documentElement.setAttribute("data-tema", S.tema);
  const h = ruteSaatIni().replace(/^#\/?/, "") || "login";
  const [area, hal = "dasbor", ...sisa] = h.split("/");
  const app = document.getElementById("app");
  if (!S.sesi || area === "login") { app.innerHTML = halLogin(); document.title = "Masuk · HRIS Invisual (demo)"; return; }
  const hr = S.sesi.peran === "hr";
  if (hr && area !== "admin") { ke("#/admin/dasbor", true); return; }
  if (!hr && area !== "user") { ke("#/user/dasbor", true); return; }
  const fn = RUTE[area + "/" + hal] || RUTE[area + "/dasbor"];
  if (hal === "tim" && S.sesi.peran !== "manager") { ke("#/user/dasbor", true); return; }
  const isi = fn(sisa);
  app.innerHTML = kerangka(isi, hal);
  const nama = (hr ? MENU_HR : MENU_KAR()).find((m) => m[0] === hal);
  document.title = `${nama ? nama[1] : "Dasbor"} · HRIS Invisual (demo)`;
  segarkanJam();
}

  document.querySelectorAll("[data-detik]").forEach((el) => { el.textContent = pad2(kini.getSeconds()); });
}

const UBAH = {}; // perubahan isian: data-u
const KIRIM = {}; // formulir: data-f

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (S.lonceng && !ev.target.closest(".panel-lonceng") && !(el && el.dataset.a === "lonceng")) { S.lonceng = false; render(); if (!el || !document.body.contains(el)) return; }
  if (!el || !el.dataset.a) {
    const a = ev.target.closest('a[href^="#/"]');
    if (a && !ev.defaultPrevented && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); ke(a.getAttribute("href")); }
    return;
  }
  const f = AKSI[el.dataset.a]; if (!f) return;
  if (el.tagName === "A") ev.preventDefault();
  f(el, ev);
});
document.addEventListener("input", (ev) => { const el = ev.target.closest("[data-u]"); if (el && UBAH[el.dataset.u] && el.dataset.saat !== "change") UBAH[el.dataset.u](el, ev); });
document.addEventListener("change", (ev) => { const el = ev.target.closest("[data-u]"); if (el && UBAH[el.dataset.u] && el.dataset.saat === "change") UBAH[el.dataset.u](el, ev); });
document.addEventListener("submit", (ev) => { const f = ev.target.closest("[data-f]"); if (!f) return; ev.preventDefault(); KIRIM[f.dataset.f] && KIRIM[f.dataset.f](f, new FormData(f)); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (document.getElementById("modal").innerHTML) tutupModal(); else if (S.lonceng || S.menuBuka) { S.lonceng = false; S.menuBuka = false; render(); } } });
const dariAlamat = () => { let h = ""; try { h = location.hash; } catch (e) { return; } if (h && h !== S.rute) { S.rute = h; S.menuBuka = false; S.lonceng = false; render(); window.scrollTo(0, 0); } };
window.addEventListener("hashchange", dariAlamat);
window.addEventListener("popstate", dariAlamat);

  staf().forEach((e) => { const r = rekap(e.id, per.dari, per.sampai); baris.push([e.id, e.nama, e.jabatan, r.hadir, r.tepat, r.telat, r.menitTelat, r.izin]); });
  unduh(`rekap-kehadiran-${per.dari}_${per.sampai}.csv`, baris.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""').replace(/^([=+\-@])/, "'$1")}"`).join(",")).join("\n"), "text/csv");

};
function unduh(nama, isi, tipe) {
  try { const b = new Blob(["﻿" + isi], { type: tipe + ";charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nama; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) { toast("Unduhan tidak didukung di sini", "gagal"); }
}

KIRIM.lembur = (f, fd) => {

RUTE["admin/kehadiran"] = () => {
  const per = S.ui.kehPer || periodeGaji();

  const rek = staf().map((e) => ({ e, r: rekap(e.id, per.dari, per.sampai) }));
  const tot = rek.reduce((s, x) => ({ tepat: s.tepat + x.r.tepat, telat: s.telat + x.r.telat, izin: s.izin + x.r.izin }), { tepat: 0, telat: 0, izin: 0 });
  let hk = 0; for (let d = dariIso(per.dari); iso(d) <= (per.sampai < HARI_INI_ISO ? per.sampai : HARI_INI_ISO); d = tambahHari(d, 1)) if (isHariKerja(d)) hk++;
  const remote = S.d.absensi.filter((a) => a.tanggal >= per.dari && a.tanggal <= per.sampai && a.mode_kerja !== "Kantor").length;
  const alpa = Math.max(0, hk * staf().length - (tot.tepat + tot.telat) - tot.izin);
  const sering = rek.filter((x) => x.r.telat).sort((a, b) => b.r.telat - a.r.telat).slice(0, 5);
  const lupa = S.d.absensi.filter((a) => a.tanggal < HARI_INI_ISO && !a.waktuKeluar);

  const tab = S.ui.kehTab;
  return `${kepala({ judul: "Manajemen Kehadiran", sub: `Analitik kedisiplinan dari data absensi — periode ${per.label}.`, aksi: `<select class="select" style="width:auto" data-u="keh-per" data-saat="change" aria-label="Periode">${daftarPer.map((p) => `<option value="${p.dari}" ${p.dari === per.dari ? "selected" : ""}>${p.label}</option>`).join("")}</select><button class="btn" data-a="unduh-csv">${ik("unduh")}Export CSV</button>` })}
  <section class="kpi-grid empat">${[["Hadir tepat waktu", tot.tepat, "hijau", "#34d399"], ["Terlambat", tot.telat, "kuning", "#fbbf24"], ["Izin / cuti / WFH", tot.izin + remote, "ungu", "#c084fc"], ["Alpa", alpa, "pink", "#f87171"]].map(([l, v, w, g]) => `<div class="kpi" data-w="${w}" data-garis style="--g:${g}"><span class="label-kecil">${l}</span><span class="nilai num">${v} <small style="font-size:15px;font-family:var(--f-body)">hari</small></span></div>`).join("")}</section>
  <div class="grid-3" style="margin-bottom:24px">
    <section class="kartu"><div class="kartu-kepala"><h3>Sering terlambat</h3>${pil("Peringatan", "kuning", "pil-kecil")}</div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${sering.length ? sering.map((x) => `<div class="baris"><b>${esc(x.e.nama)}</b>${pil(x.r.telat + "x telat", "kuning")}</div>`).join("") : `<div class="kosong">Tidak ada.</div>`}</div></div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Lupa clock-out</h3>${pil("Tindakan", "pink", "pil-kecil")}</div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${lupa.length ? lupa.map((a) => `<div class="baris"><div><b>${esc(a.nama)}</b><div class="muted" style="font-size:12.5px">${tglPendek(a.tanggal)} · masuk ${a.waktuMasuk}</div></div><button class="btn btn-kecil" data-a="isi-pulang" data-id="${a.id}">Isi jam pulang</button></div>`).join("") : `<div class="kosong">Semua sesi absensi tertutup rapi.</div>`}</div></div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Paling disiplin</h3>${pil("Apresiasi", "hijau", "pil-kecil")}</div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${disiplin.map((x) => `<div class="baris"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.e.nama)}</b>${pil(x.r.tepat + " hari tepat", "hijau")}</div>`).join("")}</div></div></section>
  </div>

  <section class="kartu">${tab === "rekap" ? htmlRekap(rek) : tab === "log" ? htmlLogHarian() : tab === "lembur" ? htmlDaftarLembur() : `<div class="kartu-isi" id="kal-isi">${htmlKalender(S.ui.kalBulan || HARI_INI_ISO, true)}</div>`}</section>`;
};

function htmlDaftarLembur() {

function hitungSlip(id, periode) {
  const e = emp(id); const r = rekap(id, periode.dari, periode.sampai);
  const tunjTransport = r.hadir * 30000, uangMakan = r.hadir * 25000;
  const lemburRp = Math.round((S.d.lembur.filter((l) => l.idKaryawan === id && l.tanggal >= periode.dari && l.tanggal <= periode.sampai).reduce((s, l) => s + l.menitWajib, 0) / 60) * (e.gajiPokok / 173) * 1.5);
  const potTelat = Math.max(0, r.telat - 3) * 20000;
  const bpjsKes = Math.round(e.gajiPokok * 0.01), jht = Math.round(e.gajiPokok * 0.02), jp = Math.round(e.gajiPokok * 0.01);
  const bruto = e.gajiPokok + tunjTransport + uangMakan + lemburRp;
  const pph = bruto > 5400000 ? Math.round(bruto * (bruto > 9000000 ? 0.035 : 0.015)) : 0;
  const bersih = bruto - potTelat - bpjsKes - jht - jp - pph;
  return { e, r, tunjTransport, uangMakan, lemburRp, potTelat, bpjsKes, jht, jp, pph, bruto, bersih };
}

}
function htmlPengajuanSaya(n = 99) {
  const p = S.d.pengajuan.filter((x) => x.idKaryawan === S.sesi.id).sort((a, b) => b.id.localeCompare(a.id)).slice(0, n);
  return `<div class="daftar">${p.length ? p.map((x) => `<div class="baris"><div><b>${esc(x.jenis)}</b><div class="muted" style="font-size:12.5px">${teksTanggalPengajuan(x.tanggal)} · ${esc(x.alasan)}</div></div>${pil(x.status, warnaStatus(x.status))}</div>`).join("") : `<div class="kosong">Belum ada pengajuan.</div>`}</div>`;
}

RUTE["user/dasbor"] = () => {
  const e = emp(S.sesi.id);
  return `<header class="kepala"><div class="orang" style="gap:16px">${av(e.id, "besar")}<div><h1 class="judul">Halo, ${esc(e.panggilan)}!</h1><p class="sub" style="margin-top:4px">${tglPanjang(HARI_INI)} · periode gaji ${periodeGaji().label}</p></div></div><div class="kepala-aksi">${htmlLonceng()}<span class="sembunyi-hp" style="display:inline-flex;gap:10px;align-items:center"><span class="demo-tag">Demo · data contoh</span>${tombolTema()}</span></div></header>
  <div class="grid-dasbor"><div class="kolom">${htmlKartuJam()}${htmlUbin()}
    <section class="kartu"><div class="kartu-kepala"><h3>Riwayat absensi</h3><a href="#/user/absen" class="tautan">Semua</a></div>${htmlRiwayat(S.sesi.id, 5)}</section></div>
  <div class="kolom"><section class="kartu">${htmlTugasSaya()}</section>
    <section class="kartu"><div class="kartu-kepala"><h3>Pengajuan saya</h3><a href="#/user/absen" class="tautan">Ajukan</a></div><div class="kartu-isi" style="padding-top:0">${htmlPengajuanSaya(3)}</div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Pengumuman</h3></div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${S.d.pesan.filter((p) => p.kanal === "c2").map((p) => `<div class="baris"><div><b>${esc(emp(p.dari).nama)}</b><div style="font-size:13px">${esc(p.isi)}</div></div></div>`).join("")}</div></div></section></div></div>`;
};

AKSI["mode-kerja"] = (el) => { S.ui.modeKerja = el.dataset.m; if (el.dataset.m !== "Kantor" && !remoteDisetujui(el.dataset.m)) toast(`Belum ada ${el.dataset.m} yang disetujui hari ini — absen tetap dicatat, HR akan meninjau`, "info"); render(); };
AKSI["clock-in"] = () => {
  const mode = S.ui.modeKerja;
  bukaModal({ judul: "Clock in · selfie", isi: `<div class="kamera" role="img" aria-label="Pratinjau kamera (simulasi)"><span>Kamera depan · simulasi</span></div>
    <p class="hint">Di aplikasi asli: kamera depan terbuka, foto dikompres lalu disimpan privat. ${mode === "Kantor" ? `Lokasi dicek: harus dalam radius ${S.d.pengaturan.radius} m dari kantor.` : "Mode " + mode + ": lokasi tidak dibatasi."}</p>`,
    kaki: `<button class="btn btn-no" data-a="tutup-modal">Batal</button><button class="btn btn-primer" data-a="clock-in-ya">${ik("kamera")}Ambil foto & clock in</button>` });
};
AKSI["clock-in-ya"] = () => {
  const e = emp(S.sesi.id); const kini = new Date(); const jam = `${pad2(kini.getHours())}:${pad2(kini.getMinutes())}`;
  const izinTelat = S.d.pengajuan.find((p) => p.idKaryawan === e.id && /Terlambat/.test(p.jenis) && p.status === "Disetujui" && p.keputusanPulang === "normal" && tanggalDalam(p.tanggal, HARI_INI_ISO));
  const komp = S.d.lembur.find((l) => l.idKaryawan === e.id && l.kompensasi === "masuk_siang" && (l.tanggalKompensasi || iso(tambahHari(dariIso(l.tanggal), 1))) === HARI_INI_ISO);
  const batas = keMenit(e.jamMasuk) + e.toleransi + (komp ? komp.menitKompensasi : 0);
  const telat = keMenit(jam) > batas && !e.fleksibel && !izinTelat;
  const mode = S.ui.modeKerja;
  S.d.absensi.push({ id: Date.now(), idKaryawan: e.id, nama: e.nama, tanggal: HARI_INI_ISO, waktuMasuk: jam, waktuKeluar: null, status: telat ? "Terlambat" : "Tepat Waktu", mode_kerja: mode, lokasi: mode === "Kantor" ? "Kantor Invisual (Selfie)" : mode + " (Selfie)", jamPulangSeharusnya: telat ? keJam(keMenit(jam) + S.d.pengaturan.durasiJam * 60) : e.jamKeluar, lembur_menit: 0, foto: true });
  tutupModal(); toast(telat ? `Clock in ${jam} — tercatat terlambat. Wajib pulang ${keJam(keMenit(jam) + S.d.pengaturan.durasiJam * 60)}` : `Clock in ${jam} berhasil. Selamat bekerja!`, telat ? "info" : ""); render();
};
AKSI["clock-out"] = () => {
  const a = absenSaya(); const kini = new Date(); const jam = `${pad2(kini.getHours())}:${pad2(kini.getMinutes())}`;
  const durasi = keMenit(jam) - keMenit(a.waktuMasuk);
  const wajib = a.jamPulangSeharusnya || emp(a.idKaryawan).jamKeluar;
  const awal = keMenit(jam) < keMenit(wajib);
  const tahan = awal && a.status === "Terlambat" && S.d.pengaturan.blokirPulangTelat;
  bukaModal({ judul: "Clock out", isi: `<p style="margin:0">Durasi kerja hari ini: <b>${Math.floor(Math.max(0, durasi) / 60)} jam ${Math.max(0, durasi) % 60} menit</b>.</p>${awal ? `<p class="hint" style="font-weight:700">Jam wajib pulang Anda ${wajib} WIB.${tahan ? " Karena datang terlambat, clock out ditahan sampai jam tersebut (bisa dinonaktifkan HR di Pengaturan)." : " Anda pulang lebih awal dari jadwal."}</p>` : ""}<p class="hint">Demo: selfie pulang disimulasikan.</p>`,
    kaki: `<button class="btn btn-no" data-a="tutup-modal">Batal</button>${tahan ? `<button class="btn" data-a="clock-out-ya" title="Hanya ada di demo">Lewati (demo)</button>` : ""}<button class="btn btn-primer" data-a="clock-out-ya" ${tahan ? "disabled" : ""}>${ik("kamera")}Ambil foto & clock out</button>` });
};
AKSI["clock-out-ya"] = () => {
  const a = absenSaya(); const kini = new Date(); a.waktuKeluar = `${pad2(kini.getHours())}:${pad2(kini.getMinutes())}`;
  const tanda = S.d.lembur.find((l) => l.idKaryawan === a.idKaryawan && l.tanggal === HARI_INI_ISO);
  if (tanda) a.lembur_menit = Math.max(0, keMenit(a.waktuKeluar) - keMenit(a.jamPulangSeharusnya || emp(a.idKaryawan).jamKeluar));
  tutupModal(); toast(tanda ? `Clock out ${a.waktuKeluar} · lembur ${a.lembur_menit} menit ${a.lembur_menit >= tanda.menitWajib ? "— kompensasi berlaku" : "— kurang dari minimal, kompensasi tidak berlaku"}` : `Clock out ${a.waktuKeluar} tercatat. Sampai besok!`); render();
};

/* ───────── ABSEN & PENGAJUAN ───────── */
RUTE["user/absen"] = () => {
  const per = periodeGaji(); const j = S.ui.pengajuanJenis;
  return `${kepala({ judul: "Absen & pengajuan", sub: `Periode ${per.label}.` })}
  <div class="grid-dasbor"><div class="kolom">${htmlKartuJam()}
    <section class="kartu"><div class="kartu-kepala"><h3>Riwayat periode ini</h3></div>${htmlRiwayat(S.sesi.id, 30)}</section></div>
  <div class="kolom"><section class="kartu"><div class="kartu-kepala"><h3>Ajukan izin</h3></div>
    <form class="kartu-isi form" style="padding-top:0" data-f="pengajuan" novalidate>
      <div><label class="lbl" for="pj-j">Jenis</label><select id="pj-j" name="jenis" class="select" data-u="jenis-pengajuan" data-saat="change">${["Cuti Tahunan", "Sakit", "Izin", "WFH", "WFC", "Izin Terlambat"].map((x) => `<option ${x === j ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      <div class="form-2"><div><label class="lbl" for="pj-a">${j === "Izin Terlambat" ? "Tanggal" : "Mulai"}</label><input id="pj-a" type="date" name="dari" class="input" value="${j === "Izin Terlambat" ? HARI_INI_ISO : iso(tambahHari(HARI_INI, 1))}"></div>
        ${j === "Izin Terlambat" ? `<div><label class="lbl" for="pj-e">Perkiraan tiba</label><input id="pj-e" type="time" name="estimasi" class="input" value="09:45"></div>` : `<div><label class="lbl" for="pj-s">Sampai</label><input id="pj-s" type="date" name="sampai" class="input" value="${iso(tambahHari(HARI_INI, 1))}"></div>`}</div>
      <div><label class="lbl" for="pj-r">Alasan</label><textarea id="pj-r" name="alasan" rows="3" class="input" placeholder="Tuliskan alasan singkat"></textarea></div>
      ${/Cuti/.test(j) ? `<p class="hint" style="margin:0">Sisa cuti Anda: ${emp(S.sesi.id).sisaCuti} hari.</p>` : ""}
      <button class="btn btn-primer">Kirim ke HR</button></form></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Status pengajuan</h3></div><div class="kartu-isi" style="padding-top:0">${htmlPengajuanSaya()}</div></section></div></div>`;
};
UBAH["jenis-pengajuan"] = (el) => { S.ui.pengajuanJenis = el.value; render(); };
KIRIM.pengajuan = (f, fd) => {
  const o = Object.fromEntries(fd.entries()); const e = emp(S.sesi.id);
  if (!String(o.alasan || "").trim()) { toast("Alasan wajib diisi", "gagal"); f.querySelector("textarea").focus(); return; }
  if (o.sampai && o.sampai < o.dari) { toast("Tanggal selesai tidak boleh sebelum tanggal mulai", "gagal"); return; }
  const tanggal = o.sampai && o.sampai !== o.dari ? `${o.dari} s/d ${o.sampai}` : o.dari;
  S.d.pengajuan.push({ id: "req-" + Date.now(), idKaryawan: e.id, nama: e.nama, jenis: o.jenis, tanggal, alasan: o.alasan.trim(), estimasi: o.estimasi, status: "Menunggu", dibuat: HARI_INI_ISO });
  toast(`Pengajuan ${o.jenis} terkirim ke HR`); render();
};

/* ───────── TIM (MANAJER) ───────── */
RUTE["user/tim"] = () => {
  const r = ringkasHariIni();
  const blok = (judul, daftar, w) => `<section class="kartu"><div class="kartu-kepala"><h3>${judul}</h3>${pil(String(daftar.length), w)}</div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${daftar.length ? daftar.map(([id, ket]) => `<div class="orang">${av(id, "kecil")}<div><b>${esc(emp(id).nama)}</b><small>${esc(ket)}</small></div></div>`).join("") : `<div class="kosong">Tidak ada.</div>`}</div></div></section>`;
  return `${kepala({ judul: "Dasbor tim", sub: `Kehadiran tim hari ini · ${tglPanjang(HARI_INI)}. Hanya melihat — keputusan tetap di HR.` })}
  <section class="kpi-grid">${[["Hadir", r.abs.length, "hijau"], ["Terlambat", r.telat.length, "pink"], ["WFH / WFC", r.remote.length, "biru"], ["Izin", r.cuti.length, "kuning"], ["Belum absen", r.belum.length, "putih"]].map(([l, v, w]) => `<div class="kpi" data-w="${w}"><span class="label-kecil">${l}</span><span class="nilai num">${v}</span></div>`).join("")}</section>
  <div class="grid-3">${blok("Tepat waktu", r.tepat.map((a) => [a.idKaryawan, `${a.mode_kerja} · ${a.waktuMasuk}`]), "hijau")}${blok("Terlambat", r.telat.map((a) => [a.idKaryawan, `masuk ${a.waktuMasuk} · ${terlambatMenit(a)} mnt`]), "pink")}${blok("Izin & belum absen", [...r.cuti.map((p) => [p.idKaryawan, p.jenis]), ...r.belum.map((e) => [e.id, "belum absen"])], "kuning")}</div>
  <section class="kartu" style="margin-top:24px">${htmlOnline()}</section>`;
};

/* ───────── PROFIL ───────── */
RUTE["user/profil"] = () => {
  const e = emp(S.sesi.id);
  const d30 = iso(tambahHari(HARI_INI, -30)); const r = rekap(e.id, d30, HARI_INI_ISO); const rate = r.hadir ? Math.round((r.tepat / r.hadir) * 100) : 0;
  const slip = S.d.periodeList.filter((p) => p.status === "final");
  const samar = (s) => s.length > 6 ? "•••• " + s.slice(-4) : s;
  return `<section class="kartu kartu-isi" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:24px">${av(e.id, "besar")}<div style="flex:1;min-width:200px"><h1 class="judul" style="font-size:32px">${esc(e.nama)}</h1><p class="sub" style="margin-top:6px">${esc(e.jabatan)} · ${esc(e.divisi)} · ${e.id}</p></div><div style="display:flex;gap:10px;flex-wrap:wrap">${tombolTema()}<button class="btn" data-a="ganti-sandi">Ganti password</button><button class="btn btn-bahaya" data-a="keluar">${ik("keluar")}Keluar</button></div></section>
  <div class="grid-2">
    <section class="kartu"><div class="kartu-kepala"><h3>Data diri</h3><span class="muted" style="font-size:12px">Perubahan data lewat HR</span></div><div class="kartu-isi" style="padding-top:0"><div class="info">
      ${[["Email", e.email], ["No. ponsel", e.noPonsel], ["Status", e.status], ["Bergabung", tglPanjang(dariIso(e.tglMasuk))], ["Jam kerja", `${e.jamMasuk} – ${e.jamKeluar}`], ["Sisa cuti", e.sisaCuti + " hari"], ["NIK", samar(e.nik)], ["Rekening", e.rekening]].map(([l, v]) => `<div><small>${l}</small><span>${esc(v)}</span></div>`).join("")}</div></div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Performa 30 hari</h3>${pil(rate + "% tepat waktu", rate >= 90 ? "hijau" : "kuning")}</div><div class="kartu-isi" style="padding-top:0"><div class="ubin-4" style="margin-bottom:18px">${[["Hadir", r.hadir], ["Tepat", r.tepat], ["Telat", r.telat], ["Izin", r.izin]].map(([l, v]) => `<div class="baris" style="flex-direction:column;gap:2px;padding:10px"><b class="num" style="font-size:22px">${v}</b><small class="muted">${l}</small></div>`).join("")}</div>${htmlUlasan(e.id, false)}</div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Slip gaji</h3></div><div class="kartu-isi" style="padding-top:0"><div class="daftar">${slip.length ? slip.map((p) => `<div class="baris"><div><b>${p.bulan}</b><div class="muted" style="font-size:12.5px">${p.label}</div></div><button class="btn btn-kecil" data-a="slip" data-id="${e.id}" data-p="${p.id}">Lihat slip</button></div>`).join("") : `<div class="kosong">Belum ada slip final.</div>`}</div><p class="hint">Slip muncul setelah HR memfinalkan periode.</p></div></section>
    <section class="kartu"><div class="kartu-kepala"><h3>Pengajuan saya</h3></div><div class="kartu-isi" style="padding-top:0">${htmlPengajuanSaya(5)}</div></section>
  </div>`;
};
AKSI["ganti-sandi"] = () => bukaModal({ judul: "Ganti password", isi: `<form class="form" data-f="sandi" id="f-sandi" novalidate><div><label class="lbl" for="gs-1">Password baru</label><input id="gs-1" type="password" name="a" class="input" autocomplete="new-password"></div><div><label class="lbl" for="gs-2">Ulangi password</label><input id="gs-2" type="password" name="b" class="input" autocomplete="new-password"></div><p class="hint" style="margin:0">Minimal 8 karakter. Demo: tidak benar-benar disimpan.</p></form>`, kaki: `<button class="btn btn-no" data-a="tutup-modal">Batal</button><button class="btn btn-primer" type="submit" form="f-sandi">Simpan</button>` });
KIRIM.sandi = (f, fd) => { if (String(fd.get("a")).length < 8) { toast("Password minimal 8 karakter", "gagal"); return; } if (fd.get("a") !== fd.get("b")) { toast("Kedua password tidak sama", "gagal"); return; } tutupModal(); toast("Password diganti (simulasi)"); };

/* ───────── TUGAS SAYA ───────── */
RUTE["user/tugas"] = () => {
  const t = S.d.tugas.filter((x) => x.orang === S.sesi.id);
  const kel = ["Working on it", "Belum mulai", "Stuck", "Menunggu ACC", "Done"];
  return `${kepala({ judul: "Daily Task", sub: `${t.filter((x) => x.status !== "Done").length} tugas terbuka. Ubah status ke “Menunggu ACC” bila siap diperiksa.` })}
  ${kel.map((s) => { const isi = t.filter((x) => x.status === s); if (!isi.length) return ""; return `<section class="kartu" style="margin-bottom:22px"><div class="kartu-kepala"><h3>${s}</h3>${pil(String(isi.length), "")}</div><div class="tabel-wrap"><table class="tabel"><thead><tr><th>Item</th><th class="sembunyi-hp">Papan</th><th class="sembunyi-hp">Tempo</th><th>Status</th></tr></thead><tbody>${isi.map((x) => `<tr><td><b>${esc(x.nama)}</b><div class="muted" style="font-size:12px">${esc(x.akun)}</div></td><td class="sembunyi-hp">${S.d.papan.find((b) => b.id === S.d.grup.find((g) => g.id === x.grup).papan).nama}</td><td class="sembunyi-hp">${x.tempo === HARI_INI_ISO ? pil("Hari ini", "pink") : tglPendek(x.tempo)}</td><td>${pilihStatus(x)}</td></tr>`).join("")}</tbody></table></div></section>`; }).join("") || `<div class="kartu kosong">Belum ada tugas untuk Anda.</div>`}`;
};
RUTE["user/chat"] = halChat;

render();
</script>
</body>
</html>
