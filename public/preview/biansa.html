function b64utf8(s){ var bin=atob(s); var b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++){ b[i]=bin.charCodeAt(i); } return new TextDecoder("utf-8").decode(b); }
var frame=document.getElementById("frame"), stage=document.getElementById("stage");
var current="t-home", ro=null;
var INNER=b64utf8(APP_B64), VP_DESK=INNER, VP_MOB=INNER.replace('content="width=device-width, initial-scale=1"','content="width=390, initial-scale=1"');
frame.srcdoc=VP_DESK;
frame.addEventListener("load", function(){
  try{ frame.contentWindow.showScreen(current); }catch(e){}
  try{ if(ro){ ro.disconnect(); } ro=new frame.contentWindow.ResizeObserver(fit); ro.observe(frame.contentWindow.document.body); }catch(e){}
  fit();
});
function fit(){ if(stage.classList.contains("mobile")) return; try{ frame.style.height=frame.contentWindow.document.documentElement.scrollHeight+"px"; }catch(e){} }
function show(id){ current=id; try{ frame.contentWindow.showScreen(id); }catch(e){} setTimeout(fit,40); }
window.syncTab=function(id){ document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x.dataset.s===id); }); current=id; setTimeout(fit,40); };
document.querySelectorAll(".tab").forEach(function(b){ b.onclick=function(){ document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on"); show(b.dataset.s); }; });
var dBtn=document.getElementById("dev-desk"), mBtn=document.getElementById("dev-mob");
dBtn.onclick=function(){ if(!stage.classList.contains("mobile")) return; stage.classList.remove("mobile"); dBtn.classList.add("on"); mBtn.classList.remove("on"); frame.style.height=""; frame.srcdoc=VP_DESK; };
mBtn.onclick=function(){ if(stage.classList.contains("mobile")) return; stage.classList.add("mobile"); mBtn.classList.add("on"); dBtn.classList.remove("on"); frame.style.height=""; frame.srcdoc=VP_MOB; };
window.addEventListener("resize", fit);
</script>
